:{statsDelta:{energy:-8,purpose:-2,capital:6,life:-2,impactScore:8},orgFinanceDelta:1},outcomeText:"你花了三天用溫柔客氣的語氣打完四十通電話，意外說服八位教授直接改繳終身會費，學會帳戶總算多出二十萬元緩衝金。"},{id:"firm_bylaws",label:"依理監事會決議與章程平等處理，不開特例",sublabel:"維護制度公平，但得自己承受理事長關切",effect:{statsDelta:{energy:-5,purpose:6,capital:2,life:1,impactScore:7}},outcomeText:"老會員雖然不滿地向理事長告狀，但幾位年輕理監事私下傳訊息力挺你「終於有人敢照章程走」。"}]},{id:"soc_credit_system_crash",title:"繼續教育學分系統出包：三百位會員執照續期告急",category:"work",tag:"繼續教育行政",weight:15,conditions:{orgTypes:["academic_society"],excludeOutsideNPO:!0},narrative:"衛福部／相關主管機關更換積分申報平台格式，學會外包的低價舊系統忘記同步欄位，導致上個月三場大型工作坊共 320 位會員的繼續教育學分全部匯入失敗。週五傍晚五點，抗議信件與電話湧入，許多會員下週就面臨換照死線。",choices:[{id:"weekend_manual_fix",label:"週末抱筆電回家一筆筆手動轉檔上傳，並公開發道歉與進度表",sublabel:"保住學會信譽與會員換照資格，但整個週末報銷",effect:{statsDelta:{energy:-14,purpose:5,capital:7,life:-8,impactScore:13},setFlag:"soc_credit_hero"},outcomeText:"你在電腦前核對了 320 筆身分證字號與時數到週日深夜，週一早上九點發信通知全數入檔成功。那天辦公室收到了兩位會員寄來的手搖飲外送。"},{id:"vendor_pressure",label:"正式發函要求系統商緊急派工處理，並在網站公告延期說明",sublabel:"減少個人過勞，但會員怒火會延燒一個禮拜",effect:{statsDelta:{energy:-6,purpose:-2,capital:4,life:2,impactScore:6},savingsDelta:0},outcomeText:"系統商拖到下週三才修好欄位，這五天你接了上百通憤怒電話，但也逼使理監事會終於同意編列明年更新資訊系統的預算。"}]},{id:"soc_journal_delay",title:"學會期刊面臨「開天窗」與教授拖稿危機",category:"work",tag:"出版與審查",weight:14,conditions:{orgTypes:["academic_society"],excludeOutsideNPO:!0},narrative:"每年兩期的學會學報即將截稿，若無法如期出刊，明年爭取國科會或相關評鑑的期刊點數將直接扣分。總編輯教授忙著升等與計畫結案已讀不回一週，兩位審查委員也遲遲未交回審查意見表。",choices:[{id:"camp_office",label:"親自跑去總編輯研究室堵人順便幫他整理文獻格式",sublabel:"準時保住出刊紀錄，代價是越界做起編輯苦工",effect:{statsDelta:{energy:-10,capital:5,purpose:2,life:-4,impactScore:10}},outcomeText:"教授不好意思地趕工寫完編者序，期刊如期印出寄往各校圖書館。但從此以後編輯委員會更理所當然把格式校對全推給你。"},{id:"restructure_process",label:"啟動備援徵稿名單並向理事會提案設立「專任編輯津貼」",sublabel:"花時間建立制度，避免明年重複上演地獄",effect:{statsDelta:{energy:-5,capital:8,purpose:5,life:0,impactScore:11}},outcomeText:"這期雖然延後三週出刊被幾位會員碎念，但理事會終於看見「沒有專責執行編輯」的結構問題，通過每期一萬五千元的專案編輯費。"}]},{id:"soc_sub_association",title:"「順便兼管」另一個新成立的相關學會",category:"work",tag:"一人兼多會",weight:14,conditions:{orgTypes:["academic_society"],excludeOutsideNPO:!0,minTenure:2},narrative:"幾位關係密切的常務理事合組了一個跨領域次專科／子學會，因為剛立案沒預算請人，理事笑著對你說：「反正辦公桌都在同一間，你平常發信順便幫我們發一下、收個會費，我們每個月補貼你三千元車馬費！」",choices:[{id:"take_side_allowance",label:"為了那三千元與人情接受兼辦",sublabel:"實質增加一點月收入，但變成兩間學會同時打電話給你",effect:{salaryDelta:3e3,statsDelta:{energy:-12,purpose:-3,capital:4,life:-7,impactScore:8}},outcomeText:"三千元聽起來不無小補，但兩個月後你發現兩間學會的會員大會撞在同一個月，每天像精神分裂一樣切換兩個官方信箱與兩套帳本。"},{id:"decline_and_propose_parttime",label:"婉拒無償兼管，提議合聘一位半職行政助理分攤兩會庶務",sublabel:"沒拿到三千元，卻守住工作量不至於崩盤",effect:{statsDelta:{energy:2,capital:7,purpose:5,life:4,impactScore:9}},outcomeText:"理事一開始嫌麻煩，但看到你列出的實際工時統計表後還是點頭同意合聘工讀生。你也第一次練習到如何拒絕「順便一下」的無限擴張。"}]},{id:"soc_ministry_audit",title:"內政部人民團體會務查核與改選流會警報",category:"work",tag:"人團法規現場",weight:13,conditions:{orgTypes:["academic_society","grassroots"],excludeOutsideNPO:!0},narrative:"年度會員大會規定必須有過半數會員（含委託書）出席才算有效，但離報到截止只剩四十分鐘，現場簽到與委託書加起來還差 28 張。偏偏今年主管機關派了科員來列席指導，一旦流會，所有年度預算案與理監事改選都將被迫重辦。",choices:[{id:"blitz_proxy_calls",label:"啟動「委託書奪命連環扣」＋現場請理事立刻傳真／線上補件",sublabel:"狼狽卻救場成功，練就人團法實務硬功夫",effect:{statsDelta:{energy:-10,capital:8,purpose:2,life:-2,impactScore:10}},outcomeText:"在截止前五分鐘驚險壓線湊滿法定人數！那位主管機關科員點點頭簽了名，你手心全是汗，卻也深刻體會民間團體維繫民主程序有多耗費心力。"},{id:"propose_delegate_system",label:"依規定宣告流會改開二次會議，順便推動「會員代表制」修章",sublabel:"短期很尷尬，但能根治學會動輒千人卻湊不齊出席率的結構難題",effect:{statsDelta:{energy:-7,capital:10,purpose:6,life:0,impactScore:12},milestoneTag:"推動人民團體會員代表制修章"},outcomeText:"二次大會雖然讓行政多跑一輪公文，但你把流會危機轉成修章契機，半年後順利通過分區會員代表制，從此以後學會不再每年為簽到人數提心吊膽。"}]},{id:"ind_union_leak_scare",title:"秘密籌組工會名單疑似外洩：資方個別約談風暴",category:"work",tag:"工會籌組防線",weight:18,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0},narrative:"你協助集團尚未設分會的關係企業或外地據點秘密籌組工會／分會已經三個月，距離三十人發起門檻只差最後五份連署書。不料昨晚有兩名熱心員工被單位主管個別叫進會議室「關心最近是不是下班跟外面工會的人走很近」，群組瞬間人心惶惶，已有三人私訊想撤回連署。",choices:[{id:"rush_register_and_protect",label:"連夜補齊備位發起人送件登記，並教大家錄音蒐證申請不當勞動行為裁決",sublabel:"正面對決資方打壓，體力與心理張力拉滿",effect:{statsDelta:{energy:-14,purpose:12,capital:9,life:-7,impactScore:18},setFlag:"union_won_organizing",milestoneTag:"頂住資方約談壓力完成工會立案"},outcomeText:"你們在 72 小時內把三十份文件搶先送進市政府勞工局取得立案證書。發起人雖然還是被調班刁難，但有了法定保護傘與裁決案撐腰，終於沒有人撤退。"},{id:"slow_down_underground",label:"暫時轉為地下一對一深耕，撤下公開社群動作先保住發起人飯碗",sublabel:"避開正面碰撞，但進度拖長且部分勞工會失去耐心",effect:{statsDelta:{energy:-7,purpose:3,capital:5,life:-2,impactScore:8}},outcomeText:"你們取消了工廠外發傳單，改在假日約咖啡廳小聚，撐過這波清查。雖然多花了半年才立案，但核心幹部一個都沒被資遣。"}]},{id:"ind_union_strike_vote",title:"勞資調解破裂：是否推動「罷工投票」的關鍵抉擇",category:"work",tag:"集體爭議權",weight:18,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:2},narrative:"針對輪班加班費與年終減半的爭議，經過三次市政府勞資調解依舊完全破裂，資方代表在會議結束前只留下一句「不爽可以走法院」。工會理事會分成兩派：鷹派主張立刻啟動合法罷工投票，鴿派擔心會員只敢在群組罵、真要過半投票會失敗收場反而讓工會徹底漏氣。",choices:[{id:"organize_strike_ballot",label:"扛起全部動員規劃，走進每個班別辦說明會衝刺過半罷工投票",sublabel:"工運組織者的終極考驗：成則寫下歷史，敗則元氣大傷",effect:{statsDelta:{energy:-16,purpose:14,capital:12,life:-9,impactScore:22},roleLevelDelta:1,milestoneTag:"籌辦合法罷工投票並逼回資方談判桌"},outcomeText:"連續三週每天清晨六點與半夜十二點守在換班口開講，投票箱開出的那一刻同意票跨越法定門檻！資方隔天主動重啟協商，雖然你累到失聲一週，卻成為圈內敬重的核心組織者。"},{id:"escalate_media_and_inspection",label:"先打勞動檢查、裁決與記者會輿論戰，保留罷工牌不貿然梭哈",sublabel:"穩健累積談判籌碼，但也可能被激進幹部批評太保守",effect:{statsDelta:{energy:-9,purpose:6,capital:8,life:-3,impactScore:13},boardClimate:"factional"},outcomeText:"連續兩波勞檢罰單與媒體報導逼使資方讓步五成條件。雖然激進派幹部仍嫌不夠痛快，但會員至少實質領回了積欠已久的加班費。"}]},{id:"ind_union_gift_members",title:"會員只問「今年五一發什麼禮券」，沒人要來開會員大會",category:"work",tag:"工會內部民主",weight:16,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0},narrative:"工會上週剛幫兩位被違法解僱的會員談回百萬資遣費，但當你在會員大群組公告這週六召開年度會員大會與團協草案說明時，底下連續十幾則回覆都在問：「秘書，沒辦法到可以託人代領超商禮券嗎？」「繳會費就是為了紀念品啊。」那一刻你盯著螢幕感到一陣深深的虛無。",choices:[{id:"labor_ed_reframing",label:"設計互動式勞權小遊戲與個案分享，把領紀念品的場合變成分組對話現場",sublabel:"不放棄跟「冷漠多數」溝通，花兩倍力氣設計活動",effect:{statsDelta:{energy:-10,purpose:7,capital:7,life:-3,impactScore:12}},outcomeText:"你把無聊的議程拆成「三分鐘看懂你少領多少加班費」實算工作坊，原本只想領完便當就走的會員，居然多留了半小時開始追問自己的班表。"},{id:"accept_service_reality",label:"承認工會兼具服務與互助性質，把心力集中在願意站出來的 15% 骨幹幹部",sublabel:"調整心理預期，減少無謂的自我消耗",effect:{statsDelta:{energy:3,purpose:-3,capital:4,life:3,impactScore:6}},outcomeText:"你想通了「不是每個勞工都有餘裕當社運青年」，不再因群組冷場而受傷，把時間省下來深度培訓各部門願意出面的種子代表。"}]},{id:"ind_union_self_overwork",title:"「幫別人爭勞權的我們，自己卻沒有加班費」",category:"work",tag:"工會勞動條件",weight:17,conditions:{orgTypes:["industrial_union","occupational_union"],excludeOutsideNPO:!0},narrative:"這季為了趕辦重大勞資爭議、會員大會與週末活動，你已經連續 19 天沒有完整休假，月均工時突破 220 小時。你鼓起勇氣在工會理事會提出「秘書處也應落實一例一休與補休制度」，沒想到幾位本身也是基層勞工的理事卻皺眉說：「我們會費也是會員一塊一塊繳出來的，以前前輩辦會務哪有在算幾點下班的？」",choices:[{id:"negotiate_cba_inside",label:"拿出自己的工時紀錄與勞基法條文，正式跟自家理事會「團體協商」",sublabel:"極度尷尬的一戰，但決定工會秘書這份工作能否長久",effect:{statsDelta:{energy:-6,purpose:9,capital:8,life:6,impactScore:11},salaryDelta:2e3,milestoneTag:"成功推動工會內部秘書處工時保障條款"},outcomeText:"討論氣氛一度僵到冰點，最後一位資深女理事開口挺你：「我們自己都在罵資方用熱血綁架員工，不能對自己的秘書做一樣的事。」最後通過了確實補休與加班費上限制度。"},{id:"swallow_for_movement",label:"看到工會帳上抗爭基金捉襟見肘，默默把提案收回只求補休兩天",sublabel:"維持表面和諧，內心對組織文化多了一道裂痕",effect:{statsDelta:{energy:-8,purpose:-8,capital:1,life:-4,impactScore:4}},outcomeText:"理事們誇你體諒工人辛苦，但那天深夜坐捷運回家時，你突然覺得那些「體諒」跟一般公司老闆講的「共體時艱」聽起來有八分像。"}]},{id:"ind_union_slapp_lawsuit",title:"資方祭出民事求償千萬與假處分：司法戰施壓",category:"work",tag:"勞資司法攻防",weight:14,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:3},narrative:"工會在股東會場外拉布條抗議低薪與違法解僱後，資方聘請大型事務所對工會與包括你在內的三位幹部寄出存證信函，以「侵害商譽」為由求償一千兩百萬元。家人看到掛號信嚇壞了，工會帳上現金卻只有八十萬。",choices:[{id:"counter_media_and_legal",label:"聯繫義務律師團開記者會反擊「SLAPP 策略性訴訟」，發起小額抗爭募款",sublabel:"正面迎戰司法恐嚇，考驗心理韌性與社會串聯力",effect:{statsDelta:{energy:-13,purpose:10,capital:11,life:-6,impactScore:17},setFlag:"union_survived_slapp"},outcomeText:"友會與勞動法學者聯合聲援，三天內募到足夠的訴訟擔保與宣傳費。一年後法院認定工會抗議屬合理意見表達駁回求償，你也收進人生第一張律師團的擊掌照。"},{id:"settle_quietly",label:"為保護幹部家庭不被查封薪資，評估與資方交換條件撤除部分抗議行動",sublabel:"大幅降低風險，但得吞下「退讓」的內部責難",effect:{statsDelta:{energy:-5,purpose:-7,capital:3,life:4,impactScore:4},boardClimate:"factional"},outcomeText:"資方撤回告訴，換取工會半年內不再於總部外抗議。雖然保住了每位幹部的生活平靜，但有幾位年輕會員失望地退出了群組。"}]},{id:"ind_union_cba_win",title:"歷時兩年談判：第一份《團體協約》簽署在即",category:"work",tag:"團體協約里程碑",weight:14,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:4},narrative:"歷經十四輪馬拉松式協商，資方終於鬆口願意在《團體協約》寫入調薪公式與育兒留停保障，但最後一刻要求刪除「非會員不得搭便車條款」（禁止搭便車條款），條件是換取每位會員再多 500 元伙食津貼。這考驗工會是要守住制度長遠生命力，還是先拿眼前實惠安撫會員。",choices:[{id:"hold_anti_freerider",label:"死守「禁止搭便車條款」與工會會務公假，絕不退讓組織根基",sublabel:"可能讓簽約再延半年，但守住工會永續籌碼",effect:{statsDelta:{energy:-10,purpose:11,capital:10,life:-3,impactScore:19},milestoneTag:"成功簽署含禁搭便車條款之團體協約",salaryDelta:2e3},outcomeText:"資方拖了四個月見工會寸步不讓，最終還是簽字了。這份條文讓接下來的入會率一口氣翻倍，成為台灣工運教科書級的簽約案例。"},{id:"take_immediate_wage",label:"優先替基層拿下實質津貼與調薪公式，先簽下歷史性第一份團協",sublabel:"讓會員立刻有感，組織擴張留待下一輪再戰",effect:{statsDelta:{energy:-6,purpose:6,capital:8,life:2,impactScore:15},milestoneTag:"完成工會首份團體協約簽署"},outcomeText:"簽約當天會場掌聲不斷，輪班媽媽抱著你感謝多出的津貼與育兒保障。儘管知道「搭便車」問題遲早還要再戰一次，至少你們跨出了第一步。"}]},{id:"ind_union_faction_split",title:"工會理事會路線分裂：談判派與抗爭派攤牌",category:"work",tag:"組織路線衝突",weight:14,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0},narrative:"工會內部兩大派系在會員代表大會前夕徹底撕破臉：理事長這派主張維持與資方及勞動部官員的體制內對話管道；監事會召集人那派則公開貼文痛批秘書處「軟弱妥協」，要求立刻發動包圍主管機關抗爭。雙方都要你這個全職秘書表態選邊站。",choices:[{id:"mediate_procedural",label:"維持秘書處中立專業，把兩派方案交由會員無記名投票決定",sublabel:"短期兩邊都不討好，但守住工會民主正當性",effect:{statsDelta:{energy:-10,purpose:6,capital:8,life:-2,impactScore:11},boardClimate:"transition"},outcomeText:"兩邊幹部輪流把你罵了一輪「沒有立場」，但公開辯論與無記名投票讓普通會員第一次真正參與決策，也保住了工會沒分裂出走。"},{id:"back_militant_action",label:"判斷資方只吃硬不吃軟，力挺強硬抗爭路線並協助動員",sublabel:"痛快出氣但政治風險極高，可能引爆理事集體請辭",effect:{statsDelta:{energy:-12,purpose:8,capital:5,life:-5,impactScore:12},boardClimate:"factional"},outcomeText:"記者會確實上了新聞頭版，迫使部會官員出來接陳情書；但理事長一派在會後遞出辭呈，留下滿地分裂的會務等你收拾。"}]},{id:"occ_counter_explosion",title:"欠費斷保會員在工會櫃檯拍桌：「我繳了十年怎麼沒勞保！」",category:"work",tag:"職業工會櫃檯",weight:18,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0},narrative:"週一早上九點，一位滿身油漆味的師傅衝進辦公室拍桌怒吼，因為他上週工作受傷想請領給付，醫院一查才發現他已被退保。調出系統紀錄，工會三個月前寄過兩次雙掛號催繳與四通簡訊通知，他自己搬家沒改地址又欠繳兩期保費，但他堅持「我平常那麼忙哪有看信，就是你們秘書偷懶沒打電話」。",choices:[{id:"help_remedy_calmly",label:"先穩住情緒幫他查清楚醫療與補救管道（如職災保護法救濟），同時拿簽收紀錄說明",sublabel:"極度消耗情緒，但有機會真正幫到一個基層家庭",effect:{statsDelta:{energy:-11,purpose:7,capital:7,life:-3,impactScore:13},setFlag:"occ_saved_craftsman"},outcomeText:"你替他整理好職保法相關申請與急難救助資料，兩週後師傅拎著一袋蓮霧回來櫃檯小聲說「歹勢那天太急口氣不好」。這大概是職業工會裡最真實的瞬間。"},{id:"strict_boundary",label:"請理監事出面依規章與送達回執處理，拒絕無限上綱的櫃檯情緒勒索",sublabel:"守住第一線行政人員尊嚴與作業標準",effect:{statsDelta:{energy:-5,purpose:1,capital:4,life:4,impactScore:6}},outcomeText:"你把雙掛號收執聯複印出來交給他並保持安全距離。雖然對方嘴裡碎念還是走了，但也讓辦公室其餘兩位會務姊妹鬆了一口氣。"}]},{id:"occ_occupational_injury_win",title:"替基層自營會員爭取到百萬職災失能給付",category:"work",tag:"職災權益現場",weight:16,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0},narrative:"一位單親媽媽會員通勤摔傷嚴重骨折，勞保局初步以「非工作時段且證據不足」駁回職災認定，改按普通傷病給付，金額落差高達數十萬。她幾乎想放棄申訴，問你工會能不能幫她寫覆審理由書。這完全超出單純代辦加退保的本業，寫下去得自己翻法條與跑現場拍照。",choices:[{id:"fight_appeal",label:"下班後陪她調監視器與路線紀錄，逐條寫出專業申訴書並陪開審議會",sublabel:"超時投入大量心力，換取無可取代的職業尊嚴",effect:{statsDelta:{energy:-12,purpose:13,capital:9,life:-5,impactScore:19},milestoneTag:"協助會員翻案成功領回職災給付"},outcomeText:"三個月後勞保局撤銷原處分改核定職災！會員帶著孩子來工會鞠躬道謝的那天，你覺得自己做的不只是行政代辦，而是真正在撐住勞工的安全網。"},{id:"refer_legal_aid",label:"整理好基本投保與就醫時序表，協助轉介法扶與勞工局免費律師諮詢",sublabel:"在有限人手下做好專業分工，不讓自己燃燒殆盡",effect:{statsDelta:{energy:-4,purpose:5,capital:5,life:2,impactScore:9}},outcomeText:"法扶律師接手後稱讚你整理的資料時間軸非常完整清晰，既幫上會員的忙，也沒有讓已經吃緊的櫃檯作業停擺。"}]},{id:"occ_training_audit",title:"勞動部職訓計畫突擊訪視：簽到表與講師時數差兩分鐘",category:"work",tag:"職訓標案查核",weight:15,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0},narrative:"職業工會為了拓展財源與服務會員，承接了勞動部產業人才投資／失業者職訓班。偏偏這天訪視委員無預警提早二十分鐘衝進教室，發現有三位學員還沒到齊、材料清點表少了兩張簽名，揚言要把整門課列入異常紀錄，影響明年核銷與評鑑等級。",choices:[{id:"full_audit_defense",label:"立刻調出學員請假簡訊、刷卡紀錄與材料出貨單，撰寫二十頁說明附件救場",sublabel:"熬夜做文書防禦戰，保住工會明年兩百萬職訓案",effect:{statsDelta:{energy:-11,capital:7,purpose:-1,life:-5,impactScore:9},orgFinanceDelta:1},outcomeText:"你把每一分鐘的出缺席證據都對得滴水不漏，最後只被記了輕微行政提醒。理事長口頭嘉許你一句「不錯」，但隔週又多加了一班叫你順便開。"},{id:"cut_training_load",label:"誠實檢討改善並向理事會建議明年減半開班，回歸會員本業服務",sublabel:"減少行政核銷地獄，但工會收入會小幅縮水",effect:{statsDelta:{energy:4,capital:4,purpose:3,life:5,impactScore:6}},outcomeText:"理事會雖心疼補助款減少，但看到這兩年會務人員為了核銷離職了三個，終於點頭同意把人力優先留給會員服務。"}]},{id:"occ_election_factions",title:"理監事改選派系角力：要求秘書處「洩漏會員通訊錄」",category:"work",tag:"工會選舉倫理",weight:16,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0,minTenure:2},narrative:"四年一度的職業工會會員代表選舉逼近，現任理事長派與在野改革派正激烈搶票。下午，一位平時對你很客氣的常務理事把門帶上，低聲要你把全會三千多名會員的手機與住址匯出成 Excel 讓他「去拜票聯絡感情」，暗示選贏後會幫秘書處調薪。",choices:[{id:"refuse_pdpa",label:"搬出《個資法》與《工會法》嚴正拒絕，只依選委會規定寄發公開選舉公報",sublabel:"守住會務中立與法律紅線，但可能被當權派穿小鞋",effect:{statsDelta:{energy:-7,purpose:10,capital:7,life:-1,impactScore:14},boardClimate:"factional",milestoneTag:"嚴守個資法與工會選舉會務中立"},outcomeText:"那位理事臉色鐵青摔門出去，但選舉當天勞工局列席人員查核時對選務程序挑不出半點毛病。選後新理事會反而更不敢隨便叫你做違法的事。"},{id:"formal_board_resolution",label:"不私下給名單，改提議由工會統一提供「各候選人對等聯名文宣代寄服務」",sublabel:"聰明化解人情壓力，累在選前多寄一輪兩千封信",effect:{statsDelta:{energy:-9,purpose:6,capital:9,life:-3,impactScore:12}},outcomeText:"所有候選人都能公平寄一次文宣，誰也不能佔便宜。雖然選務工作量暴增，但兩派事後都承認秘書處確實辦得公道。"}]},{id:"occ_digital_upgrade",title:"推動「LINE 線上繳費與加退保」：資深老同事集體抗拒",category:"work",tag:"會務數位轉型",weight:14,conditions:{orgTypes:["occupational_union","academic_society"],excludeOutsideNPO:!0},narrative:"工會至今還在用手寫三聯單收費、每季對幾千筆郵局劃撥單對到眼睛脫窗。你想導入超商條碼繳費與 LINE 官方帳號線上查詢功能，卻遭到在工會待了二十年的資深會計姊姊強烈反對：「我們會員都做工的老實人啦，不會用手機！而且改系統萬一出錯誰負責？」",choices:[{id:"hybrid_pilot",label:"保留櫃檯紙本三個月並行，親自幫師傅與老同事一對一設定成功",sublabel:"前期加倍辛勞，但能溫和帶動整個工會升級",effect:{statsDelta:{energy:-10,capital:10,purpose:5,life:-2,impactScore:13},salaryDelta:1500},outcomeText:"第一季雙軌並行累翻了，但連六十歲的裝修師傅都學會用手機在超商刷條碼繳勞保費後，資深同事終於笑著說：「早知道這麼輕鬆十年前就該換了。」"},{id:"keep_status_quo",label:"不想撕破職場人際氣氛，暫緩系統全面改造只小幅整理 Excel",sublabel:"維持辦公室和諧，繼續承受繁重手工對帳",effect:{statsDelta:{energy:-4,purpose:-3,capital:1,life:3,impactScore:4}},outcomeText:"辦公室氣氛保住了，但每到一、四、七、十月的繳費季，桌上依舊堆滿比人還高的劃撥收據。"}]},{id:"occ_souvenir_procurement",title:"會員大會紀念品採購與理事人情關說",category:"work",tag:"人民團體採購",weight:13,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0},narrative:"今年會員代表大會共有兩百萬紀念品預算。按比價表，A 廠商的不鏽鋼保溫瓶品質好又便宜；但有兩位資深理事帶著熟識的 B 廠商名片走進來：「這家是我們自己親戚開的，東西雖然貴兩成、比較薄一點，大家互相關照嘛。」",choices:[{id:"public_bidding_matrix",label:"堅持做成三家公開比價表送理監事會記名審議，讓決定攤在陽光下",sublabel:"自保兼守住會員會費，考驗溝通智慧",effect:{statsDelta:{energy:-6,purpose:7,capital:6,life:0,impactScore:10}},outcomeText:"一旦白紙黑字列進議事錄，原本打探口風的理事反而不敢強押 B 廠商過關。你守住了幾十萬會費，也替自己留下清白的經手紀錄。"},{id:"compromise_split",label:"要求 B 廠商降價並追加品質保證條款才納入採購，換取議程順利通過",sublabel:"台灣職場的灰色折衷，心裡有點疙瘩",effect:{statsDelta:{energy:-4,purpose:-5,capital:5,life:2,impactScore:5}},outcomeText:"大會順利發完紀念品，理事們對你很滿意，但收到會員抱怨今年保溫瓶有點漏水時，你只能默默記下教訓。"}]},{id:"grass_payroll_delay",title:"月底帳上剩八萬：創辦人問「這個月薪水能不能晚十天發？」",category:"work",tag:"草根現金流危機",weight:18,conditions:{orgTypes:["grassroots"],excludeOutsideNPO:!0},narrative:"原定核撥的地方政府補助款因為承辦換人又卡在主計室，協會活存只剩八萬元，剛好只夠付房租和一位兼職老師的鐘點費。創辦人紅著眼眶找你跟另外兩位專職開會：「大家都是為了理念一起撐這個家，這期薪水能不能先延十天，我明天先去跟朋友借週轉？」",choices:[{id:"refuse_and_audit_cash",label:"堅持薪資必須準時給付，一起盤點並砍掉非緊急活動先把現金留給人事",sublabel:"幫創辦人從「熱情經營」拉回「合法雇主」底線",effect:{statsDelta:{energy:-7,purpose:4,capital:8,life:2,impactScore:9},orgFinanceDelta:1},outcomeText:"你們緊急取消了下週一場燒錢的實體市集並盤點預收款，發薪日當天薪資還是準時入帳了，也從此訂下「三個月現金安全水位」警戒線。"},{id:"agree_defer_once",label:"體諒現場辛苦答應延後兩週領薪，先刷自己信用卡買活動急需物資",sublabel:"替協會撐過難關，但讓自己的財務跟組織風險綁在一起",effect:{savingsDelta:-12e3,statsDelta:{energy:-9,purpose:5,capital:2,life:-8,impactScore:10},orgFinanceDelta:-1},outcomeText:"十八天後補助款終於入帳，薪水也補齊了。但這件事讓你開始意識到：用個人財務墊付組織缺口，往往是草根 NPO 拖垮工作者的起點。"}]},{id:"grass_founder_midnight_line",title:"創辦人半夜一點傳 LINE：「突然有個好點子，明天早上討論！」",category:"work",tag:"公私界線模糊",weight:16,conditions:{orgTypes:["grassroots","advocacy_ngo"],excludeOutsideNPO:!0},narrative:"小協會沒有打卡鐘也沒有明確工作說明書。熱血又焦慮的創辦人習慣半夜滑手機看到新聞就連發十幾則語音訊息進群組，期待大家隔天一早九點已經生出企劃雛形。這個月已經連續發生三次了。",choices:[{id:"set_line_boundary",label:"隔天早上九點整統一禮貌回覆，並提案建立「非緊急事項週會才討論」機制",sublabel:"試圖建立健康邊界，可能被當成「不夠熱血」",effect:{statsDelta:{energy:4,purpose:-1,capital:6,life:7,impactScore:6}},outcomeText:"前兩週創辦人有點失落覺得大家變冷淡，但兩個月後發現準時開會討論出的點子品質反而更高，整個小團隊離職念頭少了一半。"},{id:"reply_immediately",label:"怕漏掉關鍵訊息立刻爬起來回訊息並做筆記",sublabel:"成為創辦人最信賴的左右手，但睡眠品質持續惡化",effect:{statsDelta:{energy:-11,purpose:2,capital:4,life:-8,impactScore:8}},outcomeText:"創辦人逢人就誇你「超級可靠、跟他一樣把協會當自己的孩子」，只有你自己知道凌晨兩點盯著手機藍光的胃痛感。"}]},{id:"grass_viral_overload",title:"一篇粉專貼文意外爆紅：湧入十倍求助私訊卻沒有人力接住",category:"work",tag:"爆紅與負荷",weight:15,conditions:{orgTypes:["grassroots","local_foundation"],excludeOutsideNPO:!0},narrative:"你上週熬夜寫的真實故事貼文意外被上萬人轉發，捐款箱多進帳十幾萬元，但同時私訊信箱湧入兩百多封急切求助個案與媒體採訪邀約。你們整個協會只有四個專職，原本的服務行程已經排滿到下個月。",choices:[{id:"scale_carefully",label:"誠實公告「目前接案量已達上限」，將這筆善款專款聘請兼職專業支援並串聯友會分流",sublabel:"守住服務品質不畫大餅，考驗對大眾期待的溝通",effect:{statsDelta:{energy:-7,purpose:7,capital:9,life:0,impactScore:15},orgFinanceDelta:1},outcomeText:"雖然少數網友留言酸「募了錢還不接案」，但公開透明的人力拆解說明獲得多數定捐人理解，也讓協會首度有餘裕增聘半職人力。"},{id:"absorb_all",label:"不忍心拒絕任何一個求助者，四人咬牙輪班消化所有私訊",sublabel:"短期救了不少人，團隊卻在兩個月後逼近集體耗竭",effect:{statsDelta:{energy:-16,purpose:9,capital:3,life:-9,impactScore:17}},outcomeText:"你們撐過了那兩個月，然而當熱度退去、定捐回落時，團隊裡有一位資深夥伴默默遞出了辭呈。"}]},{id:"grass_volunteer_boundary",title:"熱心大額志工干預第一線專業判斷",category:"work",tag:"志工與專業衝突",weight:14,conditions:{orgTypes:["grassroots","local_foundation"],excludeOutsideNPO:!0},narrative:"一位長年出錢又出力的資深志工阿姨，未經告知就私下給服務家庭留了電話並承諾「協會下週會買一台新冰箱送去」，甚至在檢討會當場質疑年輕社工「照規定評估太冷血」。",choices:[{id:"educate_volunteer",label:"私下致謝後清楚說明「個案賦權與專業邊界」原則，訂立志工守則",sublabel:"冒著資深志工退團的風險保護個案與團隊專業",effect:{statsDelta:{energy:-7,purpose:8,capital:6,life:0,impactScore:11}},outcomeText:"志工阿姨生氣了一個月沒來，但後來在你的邀請下參加了培訓課，終於理解直接塞物資與長期陪伴的差異。"},{id:"smooth_over",label:"先順著阿姨面子把事情圓過去，叫內部自己補破網",sublabel:"保住人情與捐款來源，第一線同事感到未被支持",effect:{statsDelta:{energy:-6,purpose:-7,capital:2,life:-1,impactScore:5}},outcomeText:"志工開心繼續幫忙募物資，但團隊內部開始出現「有錢有勢的志工說了算」的無力感。"}]},{id:"grass_take_gov_grant",title:"轉型十字路口：要不要開始接政府百萬委外標案？",category:"work",tag:"財源依賴選擇",weight:15,conditions:{orgTypes:["grassroots"],excludeOutsideNPO:!0,minTenure:2},narrative:"小額捐款成長見頂，政府剛好開出一個跟你們理念接近的兩百萬年度委外方案。接下去，大家明年至少不用再擔心發不出薪水；但一旦接了，未來三分之一工時都要拿來寫評鑑資料、貼發票粘存單，還要配合長官指定指標。",choices:[{id:"accept_grant",label:"投標拿下政府方案，換取穩定的薪資與固定服務據點",sublabel:"組織走上制度化與核銷日常，降低斷炊焦慮",effect:{salaryDelta:2500,orgFinanceDelta:1,boardClimate:"bureaucratic",statsDelta:{energy:-5,purpose:-2,capital:7,life:3,impactScore:11}},outcomeText:"標案順利過關，辦公室終於買了新印表機也調了基本薪。只是到了年底，大家看著厚如字典的核銷冊苦笑：「我們好像回不去了。」"},{id:"stay_independent",label:"拒絕高行政成本標案，改推「百人定期定額小額募款計畫」",sublabel:"守住組織自主性，但募款壓力直接落在團隊肩上",effect:{statsDelta:{energy:-8,purpose:9,capital:6,life:-2,impactScore:12}},outcomeText:"你們跑了二十場社區分享會終於湊齊穩定定捐戶。錢不多，但每一場活動都能照著現場真正需要的樣子長出來。"}]},{id:"large_december_audit",title:"十二月核銷地獄：被退件四次的憑證與「消化預算」",category:"work",tag:"標案核銷現場",weight:18,conditions:{orgTypes:["large_welfare","local_foundation"],excludeOutsideNPO:!0},narrative:"距離年度結案只剩十天，主管機關承辦退回你們整箱結案憑證，理由是「講師交通費沒有附上高鐵電子車票購票證明影本」以及「剩下十二萬元活動費若沒在 12/20 前執行完畢明年將減編」。明明現場案量已經爆炸，督導卻要求全組擠出兩場趕工講座把預算花完。",choices:[{id:"play_the_game",label:"加班重貼全部憑證，火速加開兩場充數講座保住明年預算額度",sublabel:"機構預算安全了，但對「形式主義」的懷疑深了一層",effect:{statsDelta:{energy:-11,purpose:-6,capital:4,life:-5,impactScore:6}},outcomeText:"你練就了在 48 小時內生出百頁結案報告的神技，明年標案預算成功保住；只是看著垃圾桶裡剩下一半的便當，心裡五味雜陳。"},{id:"redesign_useful_spend",label:"把剩餘款依法申請變更科目，採購真正急需的個案輔具與教材",sublabel:"跟公部門承辦來回公文扯皮半個月，但花得心安理得",effect:{statsDelta:{energy:-12,purpose:8,capital:8,life:-4,impactScore:14}},outcomeText:"你打了好幾通電話跟承辦解釋現場實況，奇蹟似地簽過經費流用同意函。那些原本要拿去請人吃便當的錢，最後變成了十幾個家庭的緊急生活補給包。"}]},{id:"large_salary_gap_admin",title:"衛福部社工加薪新制上路，行政與總務組卻持續凍薪",category:"work",tag:"機構內部裂痕",weight:16,conditions:{orgTypes:["large_welfare"],excludeOutsideNPO:!0},narrative:"政府補助方案調高了具證照社工的薪資基準，消息公布當天社工組歡呼；然而財務會計、總務司機與活動助理因為「不屬於直接專業人力補助項目」完全沒在調薪名單內，管銷比例限制也讓董事會不敢自掏腰包補齊。茶水間裡的氣氛冷到極點。",choices:[{id:"advocate_all_staff_raise",label:"跨組連署向董事會與管理階層提案，動用民間自由募款替行政後勤同步調薪",sublabel:"站出來為後勤夥伴發聲，可能被高層貼上難搞標籤",effect:{statsDelta:{energy:-7,purpose:10,capital:7,life:1,impactScore:13},salaryDelta:1500},outcomeText:"你們把「沒有行政核銷與接送車隊，社工根本無法跑外訪」的數據攤在理事會桌前，雖然沒全額齊頭調漲，但成功替後勤組爭取到每月兩千元的留任津貼。"},{id:"focus_own_track",label:"保持沉默專心把自身考績顧好，私下多幫行政同事分擔文書",sublabel:"避免捲入組織政治，但優秀的老會計半年後還是離職了",effect:{statsDelta:{energy:-4,purpose:-5,capital:2,life:1,impactScore:5}},outcomeText:"老會計離職後，新來的行政因為不熟核銷規則連續出錯，全機構接下來半年反而付出了更高的溝通代價。"}]},{id:"large_high_risk_midnight",title:"週五晚上十一點的急件：高風險個案再次打來哭訴",category:"work",tag:"情緒勞動與界線",weight:17,conditions:{orgTypes:["large_welfare","grassroots"],roles:["social_worker","project_exec"],excludeOutsideNPO:!0},narrative:"剛準備熄燈睡覺，工作機（或更糟，私人手機）突然響起。長期輔導的脆弱家庭案主在電話那頭情緒崩潰，伴隨背景爭吵聲。113 與緊急值班線已經接手處理過一次，但案主只信任你，喊著「你不來我就不活了」。",choices:[{id:"follow_emergency_protocol",label:"依危機處遇 SOP 同步通報 110／值班主管與警消介入，在電話上穩住情緒直到救援抵達",sublabel:"專業界線與人命之間的鋼索，深夜腎上腺素狂飆",effect:{statsDelta:{energy:-11,purpose:7,capital:8,life:-5,impactScore:14}},outcomeText:"你在客廳走來走去安撫了四十分鐘直到轄區員警與值班社工到場。掛斷電話後手還在發抖，但你知道只有建立團隊備援才不會兩個人一起沉下去。"},{id:"rush_out_alone",label:"擔心通報流程太慢，自己換衣服騎車先衝去現場看看",sublabel:"展現高度同理心，卻暴露於人身安全與職業耗竭風險",effect:{statsDelta:{energy:-17,purpose:5,capital:-2,life:-9,impactScore:12}},outcomeText:"雖然成功把案主帶去醫院急診，隔天卻被督導嚴厲檢討違反安全規範，自己也因此重感冒發燒躺了三天。"}]},{id:"large_media_witchhunt",title:"社會重大案件爆發：基層社工遭全網肉搜獵巫",category:"work",tag:"結構性背鍋",weight:15,conditions:{orgTypes:["large_welfare"],excludeOutsideNPO:!0,minTenure:2},narrative:"某縣市發生震驚全台的兒少／照顧悲劇事件，社會輿論瞬間炸鍋，新聞台整天重播「社福機構失靈」，連你們組織粉專也湧入大量留言謾罵「領善款不做事」。主管機關一面開記者會切割，一面發公文要求全國社福機構下週全面交回千份個案複查報告。",choices:[{id:"join_solidarity_statement",label:"參與串聯跨機構基層聲明，公開指出「一比四十案量」才是系統破網元凶",sublabel:"替第一線說話找回職業尊嚴，頂著機構保守高層的壓力",effect:{statsDelta:{energy:-9,purpose:12,capital:8,life:-3,impactScore:16},milestoneTag:"參與社福基層結構改革公開連署"},outcomeText:"那份一萬多人轉發的聲明沒能立刻改變法規，但讓許多躲在辦公室哭泣的年輕社工知道自己不是孤單的代罪羔羊。"},{id:"silent_compliance",label:"關閉社群留言、默默加班完成這輪「防呆自保式」全面訪視清查",sublabel:"減少正面風波，內心對大環境卻徹底冷了一半",effect:{statsDelta:{energy:-12,purpose:-8,capital:2,life:-4,impactScore:7}},outcomeText:"你們照章補齊了兩百份簽名表交差。案主沒變安全，只是第一線的記錄時間又多被切走兩成。"}]},{id:"large_accreditation_pause",title:"機構三年一度大評鑑：停下服務兩週只為「裝訂資料」",category:"work",tag:"評鑑文化",weight:14,conditions:{orgTypes:["large_welfare"],excludeOutsideNPO:!0},narrative:"下個月主管機關將派五位外聘委員進駐機構評鑑，優等與否直接關係到明年是否能續約。全辦公室把會議室搬空，改用來排兩百個顏色統一的檔案夾，督導甚至下令「這兩週非緊急訪視先延後，先把去年少簽的督導紀錄補齊」。",choices:[{id:"build_real_template",label:"藉這次整頓直接改掉冗餘表格，做一套平日就能自動累積證據的簡化系統",sublabel:"花額外腦力重整流程，希望下一次不用再集體演戲",effect:{statsDelta:{energy:-10,purpose:4,capital:9,life:-3,impactScore:11}},outcomeText:"最後還是拿到了優等。雖然這兩週同樣累到想吐，但你建立的數位化追蹤模板，確實幫團隊在下個年度省下三分之一文書時間。"},{id:"sprint_paperwork",label:"照指示埋頭補齊漂亮封面與紙本簽章，撐完評鑑日就去大吃一頓",sublabel:"最省腦的務實做法，但強烈體會到文書荒謬感",effect:{statsDelta:{energy:-9,purpose:-5,capital:3,life:-2,impactScore:5}},outcomeText:"評鑑委員翻了十五分鐘就笑著離開了，留下整間會議室你花兩週印出來、大概再也不會有人打開第二次的彩色檔案夾。"}]},{id:"adv_legislative_ambush",title:"立法院委員會突襲排審：連夜搶寫修法版本與說帖",category:"work",tag:"國會倡議實戰",weight:18,conditions:{orgTypes:["advocacy_ngo"],excludeOutsideNPO:!0},narrative:"原本以為這會期不會動的關鍵法案，傍晚六點突然出現在立法院後天早上的議程表，而且執政與在野各自塞進對環境／勞權／弱勢極度不利的條文。辦公室瞬間進入戰時狀態，明天早上七點半要帶五十份紙本說帖堵在委員會門口發給每位立委助理。",choices:[{id:"all_night_warroom",label:"留守辦公室作戰到凌晨四點，逐條拆解反制條文並動員友團聯署",sublabel:"倡議者的腎上腺素高峰：有機會擋下惡法，但爆肝指數破表",effect:{statsDelta:{energy:-14,purpose:13,capital:10,life:-7,impactScore:20},setFlag:"adv_legislative_battle",milestoneTag:"連夜備戰擋下國會關鍵爭議條文"},outcomeText:"早上八點頂著黑眼圈站在立法院群賢樓外發說帖，下午直播看到三位委員直接照著你們說帖第三頁的數字質詢官員，最後法案成功退回保留協商！"},{id:"focused_media_brief",label:"集中火力寫兩頁精準新聞稿與圖卡鎖定關鍵記者，不搞盲目人海戰術",sublabel:"兼顧身心與傳播效率，風險是無法全面顧及所有條文",effect:{statsDelta:{energy:-7,purpose:7,capital:8,life:-1,impactScore:13}},outcomeText:"晚上十一點半準時下班回家睡覺，隔天早上六點精準搶下兩家主流網媒頭條版面，雖然條文沒全擋下，但至少迫使委員會加開一場公聽會。"}]},{id:"adv_greenwashing_sponsor",title:"一百萬贊助支票背後的「噤聲條件」",category:"work",tag:"獨立性與財務拉鋸",weight:17,conditions:{orgTypes:["advocacy_ngo","grassroots"],excludeOutsideNPO:!0},narrative:"組織今年小額定期定額流失嚴重，帳上只剩四個月營運費。這時某大型企業公關主動聯繫，表示願意捐助一百萬元支持你們的教育與社區計畫——唯一的附帶條件是：「未來一年貴會對我們集團在南部的新開發案或勞資爭議新聞稿，希望能先內部溝通、不要點名批評。」",choices:[{id:"reject_dirty_money",label:"公開且體面地婉拒這筆百萬贊助，發動「百萬元獨立倡議急難募資」",sublabel:"守住組織靈魂與社會公信力，但下個月發薪要很拚",effect:{statsDelta:{energy:-9,purpose:14,capital:9,life:-3,impactScore:18},milestoneTag:"婉拒企業附條件百萬贊助守住獨立性"},outcomeText:"你們沒點名該企業，只發布一篇《為什麼小額捐款是我們唯一的底氣》長文，意外打動上千位新定捐人進場，湊齊了七十萬——沒拿滿百萬，但團隊士氣破表。"},{id:"accept_compromise",label:"認為可切割專案界線，收下百萬先讓六位全職同事撐過今年再說",sublabel:"組織財務馬上喘口氣，但要面對內外對「被摸頭」的質疑",effect:{orgFinanceDelta:2,statsDelta:{energy:4,purpose:-12,capital:-4,life:3,impactScore:3}},outcomeText:"帳目確實好看了許多，年終也發得出來；但三個月後該企業真的發生爭議時，辦公室裡那股說不出口的沉默，讓兩位老戰友陸續提了離職。"}]},{id:"adv_online_brigading",title:"粉專斷章取義遭網軍出征：一小時湧入三千則惡意留言",category:"work",tag:"公共溝通危機",weight:15,conditions:{orgTypes:["advocacy_ngo"],excludeOutsideNPO:!0},narrative:"昨天的立場聲明被特定粉專與政治側翼擷取其中一句話做梗圖，嘲諷你們是「收錢辦事的左膠／雙標團體」。一小時內 Google 評論被洗成一顆星，辦公電話甚至有人打來飆罵三字經，還出現十幾筆寫著「退捐」的來信。",choices:[{id:"calm_factcheck",label:"穩住陣腳貼出完整原文與數據懶人包，不對罵、並設下員工接聽謾罵電話止損機制",sublabel:"考驗組織心理素質與危機公關定力",effect:{statsDelta:{energy:-8,purpose:5,capital:8,life:-2,impactScore:12}},outcomeText:"風暴延燒三天後退去，退捐數比想像中少，反而有不少長期讀者留言加油「就是因為看到你們沒跟著情緒起舞才繼續定期捐」。"},{id:"fire_back_hard",label:"不甘受辱親自下場留言逐條筆戰，氣到連續兩天吃不下飯",sublabel:"情緒發洩了一時，演算法卻只把負面戰火越推越大",effect:{statsDelta:{energy:-14,purpose:-3,capital:-2,life:-7,impactScore:5}},outcomeText:"你贏了幾句嘴仗，卻把自己捲進無止盡的網路泥巴戰，耗光一個月的創作能量，連帶延誤了真正重要的政策研究進度。"}]},{id:"adv_bill_passed",title:"倡議五年的法案終於在立法院三讀通過",category:"work",tag:"修法里程碑",weight:13,conditions:{orgTypes:["advocacy_ngo"],excludeOutsideNPO:!0,minTenure:4},narrative:"從第一場十人不到的小記者會、無數次冷門公聽會到三次政黨輪替，這部你們推動了五年的關鍵法規終於在今晚排上院會三讀。議場二樓旁聽席上坐著歷任離職和現任的戰友，不過你知道，三讀版本被偷偷刪掉了最重要的一項罰則。",choices:[{id:"celebrate_and_watchdog",label:"在立法院門口擁抱哭完這一晚，明天繼續寫「施行細則監督計畫」",sublabel:"台灣倡議者的宿命與榮光：沒有終點，只有下一階段",effect:{statsDelta:{energy:-4,purpose:15,capital:11,life:4,impactScore:24},milestoneTag:"推動核心倡議法案完成立院三讀",roleLevelDelta:1},outcomeText:"議槌落下的那一刻整個旁聽席都紅了眼眶。雖然條文只拿回七成目標，但你知道幾百萬人的處境真的因為這幾年你們沒放棄而改寫了一小步。"},{id:"critique_missing_tooth",label:"當場召開記者會嚴厲批判被閹割的罰則條文，拒絕替半套修法背書",sublabel:"維持極高批判標準，但讓辛苦陪跑的溫和盟友感到挫折",effect:{statsDelta:{energy:-7,purpose:11,capital:5,life:-2,impactScore:17},milestoneTag:"堅持完整修法標準公開發聲"},outcomeText:"新聞標題寫著「民團不滿半套修法抗議」，一部分當事人佩服你們毫不妥協的風骨，也有合作很久的學者私訊嘆氣說先肯定進步比較好推下一輪。"}]},{id:"adv_donor_fatigue",title:"政治與大選後捐款斷崖下跌：組織被迫縮編討論",category:"work",tag:"募款低谷",weight:14,conditions:{orgTypes:["advocacy_ngo","grassroots"],excludeOutsideNPO:!0},na :{statsDelta:{energy:-8,purpose:6,capital:8,life:-1,impactScore:11}},outcomeText:"你親自去服務處送邀請函並說明基金會捐助章程對政治中立的限制，最後對方只來現場拍了張照便離席，活動主角依然留給了地方長輩與孩子。"},{id:"keep_clean_venue",label:"寧可自己多花兩萬元租民間廟埕或學校操場，徹底切割地方政治人情",sublabel:"減少內耗卻多出一筆預料外的場地費壓力",effect:{statsDelta:{energy:-5,purpose:9,capital:3,life:2,impactScore:10},orgFinanceDelta:-1},outcomeText:"雖然活動經費更緊了，但整場成果展沒有半句政令宣導，社區媽媽們笑得比往年都要自在。"}]},{id:"local_endowment_yield_drop",title:"地方基金會母金孳息縮水：年度獎助學金與社造補助面臨對半砍",category:"work",tag:"基金會財源挑戰",weight:15,conditions:{orgTypes:["local_foundation","corp_intl_ngo"],excludeOutsideNPO:!0},narrative:"今年定存與股利配息不如預期，董事會通知明年可動支的公益孳息少掉三成。然而縣內四間偏鄉小學的課輔班和兩個文史保存團隊都正指望你們的續約補助過日子。",choices:[{id:"crowdfund_match",label:"發起「在地企業與鄉親 1:1 相對捐款計畫」，親自拜訪中小企業補回缺口",sublabel:"走出舒適圈學募款，成功替地方留住八成獎助額度",effect:{statsDelta:{energy:-11,purpose:8,capital:10,life:-4,impactScore:15},orgFinanceDelta:1},outcomeText:"跑了二十幾家在地食品廠與校友會，雖然吃過不少閉門羹，最後居然真的湊回了一百二十萬，順利讓課輔班照常開學。"},{id:"transparent_triage",label:"提早半年召集所有受補助團隊開誠布公溝通減額比例，協助對接其他部會資源",sublabel:"避免年底斷崖式停辦造成現場混亂",effect:{statsDelta:{energy:-6,purpose:4,capital:6,life:1,impactScore:9}},outcomeText:"幾個小團隊雖然失望，但因為提早半年得知消息並拿到你的轉介清單，成功轉向文化部與民間大基金會補上資金。"}]},{id:"corp_annual_esg_crunch",title:"年報與國際評比截稿季：把一年血汗壓縮成十二頁英文 SROI 圖表",category:"work",tag:"跨國報告文化",weight:16,conditions:{orgTypes:["corp_intl_ngo"],excludeOutsideNPO:!0},narrative:"母公司要編寫永續報告書送國際道瓊永續指數（DJSI）評比，總部又同步要求交出台灣區影響力英文年報。這兩週你幾乎忘記台灣現場長什麼樣子，整天在調整雙語表格、驗證每張照片肖像權授權書、以及把社區阿公阿嬤的改變換算成貨幣化社會報酬率。",choices:[{id:"craft_honest_metrics",label:"堅持在英文報告裡保留「質性訪談與失敗反思」，不讓數字變成單純的粉飾工具",sublabel:"加班打磨雙語文本，守住專業報告的誠實度",effect:{statsDelta:{energy:-10,purpose:5,capital:10,life:-5,impactScore:12}},outcomeText:"總部審閱官反而稱讚台灣分會寫出的反思章節非常有說服力，讓這份年報不只是冰冷的 KPI 展示冊。"},{id:"automate_and_protect_time",label:"建立標準化雙語影響力儀表板模板，準時交件後立刻把時間留回給實務夥伴",sublabel:"效率優先，練習不要被繁瑣的跨國報表吞噬全部心力",effect:{statsDelta:{energy:-4,purpose:1,capital:7,life:4,impactScore:8}},outcomeText:"你把繁瑣的數字清洗流程簡化了一半，終於在週五準時關掉電腦去吃一頓熱騰騰的火鍋。"}]},{id:"common_whistleblower_dilemma",title:"組織內部帳務瑕疵：發現資深主管把個人餐敘混進會務經費與專案核銷",category:"work",tag:"職場倫理底線",weight:14,conditions:{excludeOutsideNPO:!0,minTenure:2},narrative:"核對季度單據時，你意外發現幾張打著「跨團體聯繫會議」名義報支的高價餐廳發票，實際上是理事長或某資深主管私人宴請友人的開銷。金額不算天文數字，但這正是會員與支持者最痛恨的信任破口。",choices:[{id:"block_and_record",label:"堅持依財會準則退件不予核銷，並請監事會召集人備查帳務內控流程",sublabel:"守住組織清白與自己不背黑鍋的法律底線，但辦公室氣氛降至冰點",effect:{statsDelta:{energy:-8,purpose:10,capital:6,life:-2,impactScore:12},boardClimate:"factional",milestoneTag:"擋下組織內部不實核銷守住財務公信力"},outcomeText:"對方臉色鐵青自己把發票抽回去改用私人支付。雖然接下來三個月你在辦公室被冷處理，但至少每個發薪日和年終簽名時你問心無愧。"},{id:"warn_privately_fix",label:"私下提醒對方這次改列為「自籌公關雜支上限內」或自行抽回，避免鬧上理事會",sublabel:"拆彈成功也保住對方台階，但見識到組織治理的灰色地帶",effect:{statsDelta:{energy:-5,purpose:-3,capital:4,life:1,impactScore:5}},outcomeText:"那位主管尷尬地笑笑說「啊不小心混到私卡收據」，抽回發票後再也沒犯過。只是你心裡多了一層警覺，從此所有經手憑證一定雙重留底。"}]},{id:"labor_multi_employment_trap",title:"「多元就業開發方案」期滿倒數：公法救助無勞退與失業給付的斷層",category:"work",tag:"多元方案斷層",weight:26,conditions:{employmentTypes:["multi_employment"],excludeOutsideNPO:!0},narrative:"你透過勞動部「多元就業開發方案」進駐協會滿一年，領著接近基本工資的上工津貼卻實際在扛全職專案與核銷。因官方將此方案定調為「公法救助關係」而非一般勞雇關係，這一年雖有勞保與健保，但完全不適用《勞基法》與《就業保險法》——既沒有一毛錢雇主 6% 勞退提撥，方案期滿也沒有資遣費或失業給付可領。補助即將屆滿，組織卻說自籌款不足無法轉正職，主管委婉問：「要不要先空窗一陣子，或是改簽自然人承攬繼續幫我們？」",choices:[{id:"fight_convert_regular",label:"拒絕非法空窗回聘，拿出這一年建立的服務實績與外部補助提案爭取轉為一般正職",sublabel:"成功轉正職納入《勞基法》、就業保險並開始享有雇主 6% 勞退提撥",effect:{changeEmploymentType:"regular",salaryDelta:2e3,statsDelta:{energy:-8,purpose:4,capital:8,life:4,impactScore:10},setFlag:"labor_dispute_hit",milestoneTag:"成功自多元就業方案轉為一般正職受僱"},outcomeText:"你替協會連夜寫出一份地方企業合作小額補助案，理事會看著沒有你就沒人會跑核銷系統的現實，終於點頭把你納進一般正職編制，總算開始累積 6% 勞退與就保年資。"},{id:"accept_contractor_shift",label:"不捨放掉手邊案子與收入空窗，答應先改簽「自然人承攬」續留原單位",sublabel:"表面月領多 $1,500，但同樣無 6% 勞退，連原有的單位勞健保都失去、須全額自付工會保費",effect:{changeEmploymentType:"contractor",salaryDelta:1500,statsDelta:{energy:-5,purpose:-7,life:-4,impactScore:4},setFlag:"labor_dispute_hit"},outcomeText:"你照樣每天早上九點到辦公室報到、聽從主管交辦業務，只是身分從「公法救助進用人員」變成了「外部專案承攬」，依舊沒有勞退，連勞健保都得自己去職業工會全額加保。"}]},{id:"labor_fake_contractor",title:"「自然人承攬」的真相：每天打卡開早會，卻沒有勞健保與特休",category:"work",tag:"假承攬真僱傭",weight:26,conditions:{employmentTypes:["contractor"],excludeOutsideNPO:!0},narrative:"簽約時組織說「因為人事管銷上限，只能用自然人承攬領車馬費／研究費」，結果一樣要求你每天九點打卡、假日支援活動、請假要寫假單找主管簽核。這季你去查才發現，整年不但沒有一塊錢雇主 6% 勞退提撥、每筆超過兩萬還被扣 2.11% 二代健保，萬一職災或資遣完全零保障。",choices:[{id:"demand_regular_status",label:"保留出勤打卡與交辦截圖，要求組織依「從屬性事實」改簽正式勞動契約並補齊勞退",sublabel:"正視勞動權益轉回正職受僱，組織關係緊繃但拿回法定保障",effect:{changeEmploymentType:"regular",salaryDelta:-1e3,statsDelta:{energy:-7,purpose:6,capital:8,life:6,impactScore:11},boardClimate:"factional",setFlag:"labor_dispute_hit",milestoneTag:"主張從屬性打破假承攬取得正職勞健保"},outcomeText:"主管臉色很難看說「你這樣我們以後人事費很難編」，但知道勞動局認定從屬性絕對輸，最後還是乖乖補辦加保與正職聘書。"},{id:"endure_contractor_gap",label:"擔心鬧翻沒工作也沒圈內推薦信，繼續吞下承攬契約並自行去工會加保",sublabel:"維持表面和諧，內心對「民間組織比企業更懂法卻帶頭違法」感到深沉倦怠",effect:{statsDelta:{energy:-5,purpose:-11,capital:1,life:-5},setFlag:"labor_dispute_hit"},outcomeText:"每個月匯出兩千多塊職業工會保費那天，看著組織粉專正在轉貼「保障弱勢勞動權益」的貼文，你只能苦笑關掉網頁。"}]},{id:"labor_salary_kickback",title:"帳面四萬二、實領三萬六：機構要求簽「自願樂捐同意書」",category:"work",tag:"薪資回捐爭議",weight:20,conditions:{excludeOutsideNPO:!0,excludeOrgTypes:["industrial_union","occupational_union","corp_intl_ngo","academic_society"]},narrative:"新年度政府標案規定專職人員須依衛福部或計畫標準給薪，但領薪水前一天會計卻拿來一張「員工自願定期捐款授權書」，低聲說：「大家都一樣啦，帳戶進去後每個月自動轉五千塊回來當機構急難備用金，這樣明年組織才撐得下去。」",choices:[{id:"refuse_kickback_report",label:"當場拒簽並秘密錄音保存匯款憑證，拒絕成為共犯結構的一環",sublabel:"保住實領 $5,000 與原則，但馬上被列入主管眼中的頭痛人物",effect:{statsDelta:{energy:-8,purpose:8,capital:6,life:3,impactScore:14},boardClimate:"factional",setFlag:"labor_dispute_hit",milestoneTag:"當面拒簽薪資回捐同意書並保留證據"},outcomeText:"主管冷處理了你一整季、把最難搞的偏遠據點都排給你，但也因為怕你真的檢舉整份標案被追回補助款，不敢真的少發你一毛薪水。"},{id:"comply_temporarily",label:"看著資深同事都默默簽了不敢當出頭鳥，忍痛配合每月回捐兩年",sublabel:"每月實領形同減少 $4,000（年少近五萬），理想與自我認同嚴重受創",effect:{savingsDelta:-24e3,statsDelta:{energy:-5,purpose:-15,life:-7},setFlag:"labor_dispute_hit"},outcomeText:"拿到扣繳憑單那天看到上面寫著年薪五十幾萬要繳稅，實際進口袋卻少了好幾萬，那股說不出口的委屈成了壓垮熱情的重石。"}]},{id:"labor_unpaid_overtime_comp",title:"「做功德」的潛規則：累積 64 小時補休年底自動歸零",category:"work",tag:"無償加班爭議",weight:18,conditions:{excludeOutsideNPO:!0,minTenure:1},narrative:"這一年為了{weekendTask}與趕不完的業務，你照表申請了 64 小時加班補休，卻因為案量太重根本請不完。12 月底行政突然發信通知：「依組織內規，未休畢之補休視同放棄、不得折算加班費。」而且主管還暗示出勤系統只準打早上九點到下午六點。",choices:[{id:"demand_overtime_pay_law",label:"搬出《勞基法》第 32-1 條要求未休補休依法折發加班費，拒絕造假打卡紀錄",sublabel:"拿回辛苦汗水錢 $16,000，同時把「依法排班」議題逼上檯面",effect:{savingsDelta:16e3,statsDelta:{energy:-4,purpose:5,capital:6,life:4,impactScore:9},setFlag:"labor_dispute_hit"},outcomeText:"理監事會發現一旦被勞檢將罰款加上違法紀錄會影響明年政府評鑑，只好乖乖核發加班費並從明年起管制週末活動總量。"},{id:"swallow_zero_out",label:"體諒組織經費拮据自己摸摸鼻子簽名歸零，以後工作時間自己摸魚抵回來",sublabel:"失去應得加班費，對組織的信任感與投入度明顯降溫",effect:{statsDelta:{energy:-4,purpose:-11,life:-2},setFlag:"labor_dispute_hit"},outcomeText:"你沒有吵架，只是從隔天起再也不會在群組主動認領任何額外任務，心裡某一塊熱情悄悄結了霜。"}]},{id:"labor_illegal_termination",title:"標案沒續標：秘書長拿「自願離職單」要你體諒機構苦衷",category:"work",tag:"非自願離職爭議",weight:16,conditions:{excludeOutsideNPO:!0,orgTypes:["large_welfare","grassroots","local_foundation"],employmentTypes:["regular"],minTenure:2},narrative:"年度主力政府方案因為政治或評鑑因素意外落榜，機構沒了預算來源。執行長約談你：「我們明年一定還想再找你回來，但這張上面如果開『非自願離職與資遣費』會讓機構在勞工局留下不良紀錄、影響其他標案，你能不能簽這張自願離職書體諒一下？」",choices:[{id:"refuse_voluntary_resign",label:"嚴正拒絕簽署自願離職書，堅持依法給付資遣費與開立非自願離職證明轉往友會",sublabel:"守住 $35,000 資遣費與失業給付資格，順利轉職其他民間組織",effect:{savingsDelta:35e3,changeOrgType:"local_foundation",statsDelta:{energy:-6,purpose:3,capital:7,life:3,impactScore:8},setFlag:"labor_dispute_hit",milestoneTag:"拒絕被迫自願離職並依法取回資遣保障"},outcomeText:"對方見你熟諳《勞基法》第 11 條與就業保險法不敢硬碰，最終依規核發資遣費與證明。你在喘息兩個月後，也順利帶著完整年資銜接新工作。"},{id:"sign_to_keep_face",label:"念在多年情分簽了自願離職，自己少拿資遣費還失去失業給付資格",sublabel:"損失慘重（存款 -$25,000 空窗耗損），深深看清人情背後的算計",effect:{savingsDelta:-25e3,changeOrgType:"grassroots",statsDelta:{energy:-7,purpose:-14,life:-8},setFlag:"labor_dispute_hit"},outcomeText:"後來你輾轉聽說那位執行長對理事會誇稱「團隊都很無私離職幫組織省下數十萬資遣費」，那一刻你徹底清醒了。"}]},{id:"labor_seek_sw_union",title:"跨出一步：尋求「島嶼社工人員職業工會」協助",category:"intertwined",tag:"社工工會救援",weight:22,conditions:{excludeOutsideNPO:!0,orgTypes:["large_welfare","local_foundation"],minTenure:1},narrative:"長期承受低薪凍漲、回捐壓力或無償超時加班，你終於聯絡了「島嶼社工人員職業工會」的諮詢窗口。下班後在捷運站旁的咖啡廳，工會幹部翻著你的出勤與薪資明細說：「證據非常清楚絕對站得住腳，你想匿名透過工會舉報專案勞檢、還是正式申請勞資調解？」",choices:[{id:"join_sw_union_mediate",label:"正式加入社工工會！由工會幹部陪同出席勞動局調解並申請專案勞檢",sublabel:"追回積欠加班費與補繳勞退（進帳 $24,000），替同業撐開勞動底線",effect:{savingsDelta:24e3,changeEmploymentType:"regular",salaryDelta:2e3,statsDelta:{energy:-7,purpose:14,capital:11,life:3,impactScore:18},boardClimate:"factional",clearFlag:"labor_dispute_hit",setFlag:"joined_npo_union",milestoneTag:"透過島嶼社工人員職業工會調解成功討回勞動權益"},outcomeText:"調解桌上，原本態度強硬的機構代表看到工會秘書遞出整疊出勤證據與衛福部補助規範瞬間軟化。這場勝利不只替你討回公道，也逼機構取消了全院的回捐陋習。"},{id:"sw_union_quiet_audit",label:"擔心日後在社福圈求職受阻，請工會協助匿名申訴勞檢並保密協商",sublabel:"工會替你扛住曝光風險，討回部分補償 $12,000 並保有轉圜空間",effect:{savingsDelta:12e3,changeEmploymentType:"regular",statsDelta:{energy:-3,purpose:8,capital:7,life:5,impactScore:12},clearFlag:"labor_dispute_hit",setFlag:"joined_npo_union"},outcomeText:"工會幹部理解社福圈狹小的顧慮，改由工會出面舉發全院抽檢。一個月後機構悄悄補齊了欠發加班費與正式勞動契約。"},{id:"hesitate_sw_union",label:"諮詢完後仍顧慮機構名聲與督導關係，暫時決定自己再忍一忍",sublabel:"維持表面和平，卻在一次次超時訪視與核銷裡感到孤單",effect:{statsDelta:{energy:-4,purpose:-12,life:-4}},outcomeText:"工會幹部沒勉強你，只遞給你一張卡片說：「社工不該用自己的健康補破網，隨時需要我們都在。」"}]},{id:"labor_seek_npo_ind_union",title:"跨出一步：尋求「福爾摩沙非營利產業工會」協助",category:"intertwined",tag:"NPO 工會救援",weight:22,conditions:{excludeOutsideNPO:!0,orgTypes:["grassroots","advocacy_ngo","academic_society","corp_intl_ngo"],minTenure:1},narrative:"受夠了多年凍薪、假承攬真僱傭或補休年底歸零，你撥通了「福爾摩沙非營利產業工會」的諮詢專線。工會秘書看完你的契約與對話紀錄後問：「從屬性證據非常充足，你想由工會發函要求團體協商與勞檢、還是先做保密法諮協商？」",choices:[{id:"join_npo_ind_mediate",label:"正式入會！由 NPO 產業工會幹部陪同出席勞動局調解並主張勞動權益",sublabel:"追回補休折薪與勞退差額（進帳 $24,000），站出來改寫圈內潛規則",effect:{savingsDelta:24e3,changeEmploymentType:"regular",salaryDelta:2e3,statsDelta:{energy:-7,purpose:14,capital:11,life:3,impactScore:18},boardClimate:"factional",clearFlag:"labor_dispute_hit",setFlag:"joined_npo_union",milestoneTag:"透過福爾摩沙非營利產業工會成功爭取權益"},outcomeText:"原本以為民間組織大家都靠人情解決，沒想到工會出手後理監事會立刻正視法令紅線，正式將契約與工時規範改回合法正軌。"},{id:"npo_ind 徵意義的兩千元調薪。"},{id:"accept_no_raise_reality",label:"看著主管也愁眉苦臉，不好意思繼續逼問只好默默退回座位",sublabel:"再度接受一年零調薪，對職涯經濟前景與熱情的磨損加劇",effect:{statsDelta:{energy:-3,purpose:-12,life:-5}},outcomeText:"走出主管辦公室那天，你打開 104 更新了聯絡方式；不是不愛這個領域，而是真的養不起再一個五年了。"}]},{id:"welfare_media_privacy_clash",title:"媒體採訪的倫理拉扯：公關希望「拍受助家庭淚灑鏡頭」衝勸募",category:"work",tag:"大型社福倫理現場",weight:18,conditions:{orgTypes:["large_welfare"],excludeOutsideNPO:!0,minTenure:1},narrative:"年底大型勸募起跑，公關組接洽電視台專題採訪，對方製作人明講：「要有受助阿嬤和小朋友在租屋處落淚的畫面，募款電話才會響。」但你很清楚，這戶脆弱家庭的孩子下週還要去學校面對同學眼光。",choices:[{id:"protect_client_dignity",label:"堅持社工倫理拒拍正臉與悲情橋段，改以匿名剪影與制度結構受訪",sublabel:"守住個案尊嚴，但勸募短影音點閱率不如預期",effect:{statsDelta:{energy:-5,purpose:10,capital:5,life:1,impactScore:12}},outcomeText:"公關組雖然碎念少了一波流量，但那位媽媽私下握著你的手說「謝謝你們沒有把我們家當博同情的工具」，你更確定這條紅線不能退。"},{id:"compromise_guided_interview",label:"在充分知情同意與全程把關下配合側拍，換取年度急難救助金來源",sublabel:"募款順利達標、組織財力回穩，但內心留下淡淡拉扯",effect:{orgFinanceDelta:1,statsDelta:{energy:-7,purpose:-3,capital:4,life:-1,impactScore:9}},outcomeText:"節目播出後確實湧入一筆指定捐款幫了十幾個家庭，只是剪輯出來的配樂比你想像中煽情，讓你盯著螢幕久久沒關電視。"}]},{id:"welfare_new_gov_eval_kpi",title:"衛福部評鑑新增「數位量化成效」：前線社工被表單淹沒",category:"work",tag:"標案評鑑現場",weight:17,conditions:{orgTypes:["large_welfare"],excludeOutsideNPO:!0,minTenure:2},narrative:"新年度委託案評鑑指標大改版，主管機關要求把每個個案家庭的「復原力分數、轉介追蹤週期、滿意度前後測」全部登打進新系統。前線夥伴哀鴻遍野，光是填表每週就吃掉一整天訪視時間。",choices:[{id:"build_shared_template",label:"主動整理精簡版共用表單與自動彙整範本，幫全組省下重複登打時間",sublabel:"短期加班爆肝，但大幅提升團隊行政效率與你在機構的話語權",effect:{statsDelta:{energy:-10,purpose:4,capital:10,life:-3,impactScore:11},milestoneTag:"建置社福評鑑精簡登打流程"},outcomeText:"你花兩個週末把繁瑣表格改成半自動套印，前線同事終於能在六點半前收工，連主管都在跨組會議點名感謝你。"},{id:"push_back_at_review",label:"在局處業務聯繫會報直接反映過度評鑑排擠直接服務，爭取簡化表單",sublabel:"替第一線發聲，短期與承辦窗口氣氛略緊繃",effect:{statsDelta:{energy:-6,purpose:8,capital:6,life:1,impactScore:10}},outcomeText:"承辦科長當場臉色不太好看，但隔季公文真的把三張重複表格整併成一張，別家機構的社工私下傳訊稱讚你敢講真話。"}]},{id:"grassroots_rent_eviction",title:"社區據點房東通知收回都更：三個月內得重找無障礙平價空間",category:"work",tag:"草根據點危機",weight:18,conditions:{orgTypes:["grassroots"],excludeOutsideNPO:!0,minTenure:1},narrative:"經營五年的巷弄一樓據點突然收到房東通知，整排老透天要談都更不再續約。附近新大樓店租翻倍，協會帳戶裡只夠付兩個月押金，如果找不到一樓無障礙空間，輪椅長輩下個月就沒地方共餐了。",choices:[{id:"mobilize_community_search",label:"發動社區里民與店家一起找閒置老屋，週末自己刷油漆 DIY 搬家",sublabel:"體力大透支，但把危機變成凝聚社區向心力的契機",effect:{statsDelta:{energy:-13,purpose:10,capital:7,life:-4,impactScore:14},milestoneTag:"成功搶救社區據點完成無障礙搬遷"},outcomeText:"巷口五金行老闆主動牽線一間便宜老屋，十幾位志工與長輩家屬週末一起搬書櫃刷牆壁，新據點開張那天整條巷子都來吃湯圓。"},{id:"apply_public_space_share",label:"向區公所與在地教會／活動中心爭取分時段共用空間，先保住服務不斷線",sublabel:"省下高額租金與搬家體力，但每次活動都得搬運器材重新佈置",effect:{orgFinanceDelta:1,statsDelta:{energy:-6,purpose:4,capital:6,life:1,impactScore:9}},outcomeText:"雖然少了專屬的固定小客廳，但每月省下兩萬多房租讓協會財務喘了一大口氣，你也練就十分鐘內把活動中心變出共餐場地的神技。"}]},{id:"grassroots_volunteer_drama",title:"熱心資深志工阿姨在據點「下指導棋」，年輕夥伴氣到想離職",category:"work",tag:"草根團隊磨合",weight:16,conditions:{orgTypes:["grassroots"],excludeOutsideNPO:!0,minTenure:1},narrative:"創會初期就幫忙煮飯的資深志工阿姨很有熱忱，但最近常當眾指責新進社工「不會跟老人講話」，甚至私下改掉排班表。年輕同事躲在儲藏室眼眶泛紅，說再這樣下去月底就要提離職。",choices:[{id:"set_volunteer_boundary",label:"泡壺茶好好與阿姨深談，溫和但堅定畫出「志工與專職分工界線」",sublabel:"考驗溝通情商，處理得好能同時留住人情與專業",effect:{statsDelta:{energy:-7,purpose:6,capital:8,life:1,impactScore:10}},outcomeText:"阿姨一開始覺得委屈，聽懂你肯定她多年付出、只是希望分工更清楚後才釋懷。團隊重新訂了志工公約，年輕夥伴也願意留下來了。"},{id:"reorganize_shifts_quietly",label:"先用排班錯開兩人時段冷處理，避免在社區里民圈掀起人情風波",sublabel:"短期相安無事，但根本的權責模糊問題仍在",effect:{statsDelta:{energy:-4,purpose:-3,capital:2,life:2,impactScore:4}},outcomeText:"衝突暫時壓下來了，只是你每個月排班都像在玩數獨，還得隨時留意兩邊在群組裡的微妙氣氛。"}]},{id:"local_found_youth_return",title:"返鄉青年團隊補助期滿卻尚未損益兩平，董事會要求退場止血",category:"work",tag:"地方創生兩難",weight:18,conditions:{orgTypes:["local_foundation"],excludeOutsideNPO:!0,minTenure:2},narrative:"基金會連續兩年補助一組返鄉青年做地方文化導覽與農產選物，口碑很好，但淡季營收始終打不平人事成本。董事會檢討會上幾位商界董事直言：「兩年還賺不了錢就該停損，不能一直靠基金會輸血。」",choices:[{id:"design_bridge_grant",label:"提出「最後一年轉型陪伴計畫」，幫團隊對接企業採購與學校戶外教學",sublabel:"扛下董事會質疑與輔導壓力，替地方團隊爭取真正站起來的機會",effect:{statsDelta:{energy:-9,purpose:9,capital:9,life:-2,impactScore:14},milestoneTag:"協助地方返鄉團隊成功轉型自立"},outcomeText:"半年內你幫他們談成兩間企業福委會中秋禮盒與三所 掉會少一筆常年會費跟選票啦。」",choices:[{id:"enforce_strict_audit",label:"堅持依法寄發補件通知並退保不合格名單，向理事會說明一旦遭懲處全會都要陪葬",sublabel:"短期流失部分會費且得罪人情，但守住工會合法資格與自己不背刑責",effect:{statsDelta:{energy:-8,purpose:9,capital:8,life:0,impactScore:13},boardClimate:"factional",milestoneTag:"清查職業工會異常加保守住合法資格"},outcomeText:"雖然被兩位理事念了一整個禮拜，但兩個月後鄰近某工會真的因包庇掛名加保遭檢調約談，理事長這才私下稱讚你當時幫大家踩了煞車。"},{id:"soft_verification_notice",label:"先電話逐一勸導補齊接案收據與工作切結書，給三個月緩衝期自然退會",sublabel:"降低理事會與會員反彈，但行政核對工作量暴增",effect:{statsDelta:{energy:-10,purpose:2,capital:5,life:-2,impactScore:7}},outcomeText:"你花了兩週打完所有電話，大部分不合格名單都默默自行辦理退保，總算在勞保局複查前把帳面整理乾淨。"}]},{id:"occ_union_political_mobilization",title:"選前動員要求：理事長要秘書處派車找會員「衝場充人數」",category:"work",tag:"會務與政治動員",weight:16,conditions:{orgTypes:["occupational_union"],excludeOutsideNPO:!0,minTenure:1},narrative:"大選造勢黃金週前夕，理事長把你叫進辦公室，拿出一疊遊覽車調度單跟造勢背心：「某陣營的市黨部總幹事跟我們總會熟得很，週六下午要借我們工會的旗幟湊三台遊覽車的人氣，現場有發雙主菜便當跟一人五百車馬費，你拿會員名冊逐一打電話問誰有空去！」",choices:[{id:"follow_strict_consent",label:"只整理近期曾登記聯誼旅遊的意願名單，避免拿投保資料打給一般會員",sublabel:"依個資與會務界線低調配合，避免一般繳費會員反感客訴",effect:{statsDelta:{energy:-5,purpose:1,capital:4,life:0,impactScore:2}},outcomeText:"你委婉提醒《個資法》風險，只問了平時熱衷團體活動的老班底，湊齊半台車交差。既沒正面衝撞理事長，也保住一般會員對工會的基本信任。"},{id:"all_out_mobilize",label:"全力配合動員三台車，週末親自穿背心到造勢會場點名發便當與車馬費",sublabel:"幫理事長做足地方政治人情與關係，但心裡對勞工組織定位感到迷惘",effect:{statsDelta:{energy:-9,purpose:-5,capital:4,life:-6,impactScore:-1},orgFinanceDelta:1},outcomeText:"造勢現場旗海飄揚，主桌大老頻頻向理事長舉手致意。雖然理事長誇你懂人情世故、後續地方場地與補助關係更順，但回程在遊覽車上收拾便當盒時，你感到一陣強烈的疏離。"},{id:"refuse_with_boundary",label:"婉拒掛工會旗幟動員，建議改由理事個人各自邀約、不經秘書處名冊派車",sublabel:"守住工會會務中立與會員資料底線，但短期內在辦公室恐背黑鍋",effect:{statsDelta:{energy:-4,purpose:6,capital:2,life:2,impactScore:5},milestoneTag:"拒絕將職業工會會員名冊用於選舉動員"},outcomeText:"理事長臉色沉了好幾天，但幾位務實派理事其實也怕捲入政黨紛爭而私下肯定你的拿捏。工會最後沒掛名動員，櫃檯也沒收到任何會員抗議電話。"}]},{id:"ind_union_year_end_bonus_clash",title:"公司獲利創高卻縮水年終與分紅：會員群組炸鍋要求工會出手",category:"work",tag:"企業工會談判",weight:16,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:1},narrative:"公司年度財報與每股盈餘雙雙創新高，資方卻突然公告以「保留轉型資本支出」 1,purpose:-3,capital:3,life:-6,impactScore:6}},outcomeText:"幹部們鬆了口氣保住考績，但從此你的工作日從晚上七點才算第二場開始，連續兩季幾乎沒有完整週末。"}]},{id:"ind_union_dues_checkoff_battle",title:"資方片面中止「薪資代扣工會會費」：企圖切斷工會常態財源",category:"work",tag:"工會財務命脈",weight:15,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:2},narrative:"工會在協商桌上越來越有份量後，公司人資處突然發函通知：「因應薪資系統改版與個資法風險，下月起全面中止代扣轉撥工會常年會費。」一旦沒有薪資代扣（check-off），工會將不得不自行聯繫上千名會員改辦轉帳或現金繳費，會費收繳率恐怕立刻腰斬。",choices:[{id:"sue_ulp_for_checkoff",label:"認定資方惡意打壓與支配介入工會，立刻向勞動部申請不當勞動行為裁決",sublabel:"依法守住企業工會行之有年的代扣慣例與財務穩定",effect:{statsDelta:{energy:-10,purpose:10,capital:11,life:-3,impactScore:15},orgFinanceDelta:1,milestoneTag:"透過裁決戰守住企業工會薪資代扣會費權"},outcomeText:"裁決委員會明確指出既有書面授權下的代扣屬勞資誠信義務與工會活動必要基礎，責令資方恢復代扣，徹底打亂管理層斷銀根的算盤。"},{id:"build_independent_autopay",label:"趁機徹底擺脫資方系統卡脖子！兩個月內建置會員線上自動扣款與專屬資料庫",sublabel:"前期行政負擔爆表且會流失一成觀望會員，但換來永遠不受制於資方的財務自主",effect:{statsDelta:{energy:-13,purpose:9,capital:12,life:-5,impactScore:16},milestoneTag:"完成企業工會獨立金流與自主會員系統建置"},outcomeText:"你跑遍金流廠商又在各單位設攤收件兩個月，總算把八成五會員轉進工會自主授權扣款。從此人資再也拿捏不到工會的帳本與名單。"},{id:"rally_member_solidarity_collection",label:"動員各部門代表發起「守住自己的工會」現場補簽授權暨自主繳費週",sublabel:"把危機當成面對面組織再動員，測驗工會到底有多少真實死忠會員",effect:{statsDelta:{energy:-11,purpose:8,capital:7,life:-4,impactScore:13}},outcomeText:"雖然少掉了兩成只把工會當背景的冷感會員，留下來補簽授權的八百多人反而成了最堅定挺工會的核心部隊。"}]},{id:"ind_union_merger_layoff_defense",title:"集團組織重整啟動「優退／合意離職方案」：變相裁員壓力下的安置攻防",category:"work",tag:"重整與就業保障",weight:15,conditions:{orgTypes:["industrial_union"],excludeOutsideNPO:!0,minTenure:3},narrative:"集團公告部分事業群將整併外包，並由人資分批約談數十位中高齡與部門員工，端出限期七天考慮的「優離方案」，甚至暗示「不簽下個月就跨縣市調職」。好幾位年資超過十五年的老同事紅著眼眶走進工會辦公室求援。",choices:[{id:"negotiate_retrenchment_package",label:"主張依法適用大量解僱協商精神，談出高於法定標準的優離金與內部轉調優先審查期",sublabel:"全面進入緊急高張力協商，替被鎖定裁撤單位爭取實質生計保障",effect:{statsDelta:{energy:-12,purpose:12,capital:12,life:-5,impactScore:19},milestoneTag:"成功替受重整影響會員談判優離安置協議"},outcomeText:"工會拒絕讓員工單獨在七天期限內被各個擊破，最終逼出資方延長考慮期一個月，並追加數個月薪資補償與同縣市優先轉職名單。"},{id:"defend_refusers_against_forced_transfer",label:"發出禁止強制簽約與不當調動聲明，派秘書逐案陪同不願離職的會員面對人資約談",sublabel:"徹底守住想留下來的工作權，但可能被迫打一場跨年的調解訴訟戰",effect:{statsDelta:{energy:-13,purpose:11,capital:9,life:-6,impactScore:16}},outcomeText:"看到工會代表坐進約談室拿出錄音筆與調動五原則條文，主管立刻收起跨縣市調職威脅，順利讓十幾位堅持留任的老同事保住原區工作權。"},{id:"help_members_audit_terms",label:"成立臨時精算協助櫃檯，替每位受約談會員試算資遣費、舊制／新制退休金與失業給付",sublabel:"確保沒人因資訊不對稱誤簽吃虧文件，節奏較可控但未能動搖資方重整決策",effect:{statsDelta:{energy:-7,purpose:5,capital:8,life:0,impactScore:11}},outcomeText:"你替三十多位老會員找出人資原本算漏的特休未休折算與年資差額，每人平均多拿回好幾萬元應得補償。"}]},{id:"rookie_chaotic_handover",title:"報到第一週沒有交接手冊：面對前手留下的四百個「最終定稿」資料夾",category:"work",tag:"新手到職震撼",weight:22,conditions:{excludeOutsideNPO:!0,maxTenure:2,maxOrgYears:1},narrative:"興沖沖報到準備大展身手，打開共用雲端卻發現前手半年前就已離職，留下四百多個「最終版_v3_確認版_真的最後」的未分類檔案與沒密碼的帳號表。下週就要開本季第一場會議，{bossTitle}只說了一句：「你年輕人電腦比較熟，邊做邊摸索一下。」",choices:[{id:"build_clean_sop_from_scratch",label:"週末加班先砍掉重練整理出樹狀歸檔索引與簡易 SOP，替自己也替組織打底",sublabel:"消耗體力把混亂接住，建立起組織第一套透明交接架構（日後可能發揮關鍵作用）",effect:{setFlag:"rookie_built_sop",statsDelta:{energy:-7,purpose:4,capital:8,life:-4,impactScore:6},milestoneTag:"到職初期從零整理組織共享檔案與交接索引"},outcomeText:"雖然第一個週末都在幫前人的檔案重新命名中度過，但當會計與同事第一次能三秒找到去年公文時，你心裡悄悄記下這筆制度的成就感。"},{id:"just_get_through_meeting",label:"先不管歷史遺產了，只翻出本週開會要用的三份檔案硬著頭皮上陣",sublabel:"保留下班休息時間避免開局就過勞，但舊帳先埋在雲端深處",effect:{statsDelta:{energy:-2,purpose:1,capital:3,life:2}},outcomeText:"會議總算有驚無險度過，只是往後每次要調舊資料都還是得像考古一樣翻箱倒櫃。"}]},{id:"rookie_probation_review",title:"試用期滿三個月面談：{bossTitle}稱讚你「很有熱忱」卻隻字不提調薪",category:"work",tag:"菜鳥職場試煉",weight:20,conditions:{excludeOutsideNPO:!0,maxTenure:2,maxOrgYears:1},narrative:"終於熬過三個月試用期考核。面談時{bossTitle}笑著誇你學習很快、對{targetNoun}很有耐心，但講到當初面試時口頭提過「過試用期看表現微調」時，對方卻話鋒一轉：「今年大環境不容易，我們還是把心力放在理想實踐上，明年再一起看。」",choices:[{id:"ask_for_written_criteria",label:"禮貌但堅定地請對方寫下明年調薪或轉正的具體指標與時程，不讓口頭支票蒸發",sublabel:"練習為自己爭取制度白紙黑字，難免讓氣氛微僵但守住底線",effect:{statsDelta:{energy:-3,purpose:2,capital:6,life:1},salaryDelta:800},outcomeText:"空氣安靜了五秒，對方有些意外一個新人這麼看重程序，最後仍勉為其難替你加上八百元職務加給並承諾年底再評一次。"},{id:"swallow_and_prove_worth",label:"剛入行不好意思第一季就談錢，笑笑點頭想說再用半年實績證明自己",s ry:"era",tag:"台灣時代事件 · 2020",weight:40,isEraEvent:!0,conditions:{yearRange:[2020,2021],excludeOutsideNPO:!0,orgTypes:["large_welfare","grassroots","local_foundation"]},narrative:"三級警戒與防疫規範說來就來，社區共餐據點與課輔班被迫緊急關閉、實體募款義賣歸零。獨居長輩斷了熱食、脆弱家庭父母因停業頓失收入，辦公室得在一週內改組為送餐與防疫物資調度站。",choices:[{id:"covid_welfare_delivery",label:"改採無接觸送餐與防疫物資包宅配，同時把募款與志工聯繫全面搬上線",sublabel:"超時搶救服務不斷線與現金流，練就跨螢幕動員能力",effect:{statsDelta:{energy:-11,capital:10,purpose:8,life:-4,impactScore:16},milestoneTag:"帶領社福團隊完成疫情期間無接觸送餐與數位轉型"},outcomeText:"雖然半夜還在包防疫口罩與乾糧箱，但看著阿嬤隔著鐵門揮手說「有你們送便當我就不怕了」，整季的疲憊瞬間有了重量。"},{id:"covid_welfare_relief",label:"逐案協助受創家庭整理文件、向區公所與衛福部申請急難紓困",sublabel:"把自己當成政策與弱勢家庭之間最後一哩的翻譯員",effect:{statsDelta:{energy:-13,purpose:12,capital:6,life:-5,impactScore:17}},outcomeText:"你替幾十戶沒有薪資轉帳紀錄的單親與零工家庭補齊切結書送到區公所。電話打到喉嚨沙啞，卻在最恐慌的一年撐住很多人的房租。"}]},{id:"era_2020_covid_occ_union",title:"2020 疫情海嘯：自營勞工生活補貼爆量與加保資格急審",category:"era",tag:"台灣時代事件 · 2020",weight:40,isEraEvent:!0,conditions:{yearRange:[2020,2021],excludeOutsideNPO:!0,orgTypes:["occupational_union"]},narrative:"三級警戒重創基層接案與餐飲服務生計，職業工會櫃檯電話從早響到晚：會員急著問「勞工生活補貼三萬／一萬元怎麼申請」、有沒有符合無一定雇主投保資格；同時欠費斷保的人數也因收入歸零而迅速增加。",choices:[{id:"covid_occ_relief_desk",label:"緊急架設線上紓困查詢與表單收件分流，連夜替會員逐案核對加保年資並申辦補貼",sublabel:"工會櫃檯與 LINE 群組全面爆線，但守住基層自營勞工最急迫的救命錢",effect:{statsDelta:{energy:-13,purpose:12,capital:8,life:-5,impactScore:17},milestoneTag:"疫情期間協助大批職業工會會員完成勞工生活補貼申辦"},outcomeText:"你連續兩週加班核對數百份投保明細與帳戶資料，幫許多手停口停的自營會員順利領到補貼，會員對工會的向心力創下新高。"},{id:"covid_occ_installment_aid",label:"向理事會提案疫情期欠費緩繳分期並轉介地方急難補助，避免會員在最需要時斷保",sublabel:"替收入斷炊的會員守住勞健保安全網，工會行政協調負擔大增",effect:{statsDelta:{energy:-10,purpose:11,capital:9,life:-3,impactScore:15}},outcomeText:"理事會順利通過三個月彈性緩繳方案，許多差點停保的會員保住了健保與職災身分，事後繳費期回來時紛紛特地致謝。"}]},{id:"era_2020_covid_ind_union",title:"2020 疫情海嘯：減班休息（無薪假）、防疫假給薪與排班攻防",category:"era",tag:"台灣時代事件 · 2020",weight:40,isEraEvent:!0,conditions:{yearRange:[2020,2021],excludeOutsideNPO:!0,orgTypes:["industrial_union"]},narrative:"三級警戒衝擊企業營收與營運調度，工會申訴信箱瞬間塞爆：資方未經勞資協商就要求單位放減班休息（無薪假）、逼居家隔離同仁改用自己的特休扣薪、甚至片面調整出勤津貼與遠距辦公規範。",choices:[{id:"covid_ind_negotiate_furlough",label:"發函要求資方公開營運衝擊數據並召開臨時協商，守住減班休息底薪保障與反對強制扣特休",sublabel:"扛住「共體時艱」情緒勒索，替全體受僱會員守住法定薪資與特休假底線",effect:{statsDelta:{energy:-12,purpose:12,capital:10,life:-5,impactScore:17},milestoneTag:"疫情期間代表會員協商減班休息與防疫假保障方案"},outcomeText:"經過三輪密集視訊協商，資方撤回強制先扣特休的公告並簽下防疫津貼不縮水協議，讓員工看見組織協商的實質份量。"},{id:"covid_ind_report_violation",label:"迅速蒐集各部門違法減薪與片面改班公文證據，直接向地方勞動局舉發並聲請調解",sublabel:"採強硬法制對決路線，迫使資方在公權力壓力下立即止血",effect:{statsDelta:{energy:-11,purpose:11,capital:9,life:-4,impactScore:16}},outcomeText:"勞動局兩天內發函要求公司限期說明，人資處隨即改口撤回原辦法並補發爭議差額，會員群組頓時士氣大振。"}]},{id:"era_2020_covid_advocacy",title:"2020 疫情海嘯：街頭與實體講座歸零，全面轉戰線上倡議",category:"era",tag:"台灣時代事件 · 2020",weight:40,isEraEvent:!0,conditions:{yearRange:[2020,2021],excludeOutsideNPO:!0,orgTypes:["advocacy_ngo","corp_intl_ngo"]},narrative:"三級警戒下所有街頭集會、公聽會動員與實體倡議講座瞬間喊卡，新聞版面九成被每日確診數佔滿，原本關注的環境、人權或永續議題幾乎失去曝光。同時外送暴增帶來大量一次性垃圾、數位足跡隱私爭議也浮上檯面。",choices:[{id:"covid_advocacy_online_pivot",label:"一週內架起線上直播論壇與社群圖卡戰隊，把議題扣連疫情下的結構漏洞重新發聲",sublabel:"練就遠距倡議與數位募資技能，在媒體真空期守住公共討論空間",effect:{statsDelta:{energy:-10,capital:11,purpose:8,life:-3,impactScore:15},milestoneTag:"帶領團隊完成疫情期間線上倡議與數位轉型"},outcomeText:"你在一週內學會 OBS 直播與線上連署導流，單場線上座談意外吸引上千位跨縣市網友參與，也開拓出一批全新的年輕定捐支持者。"},{id:"covid_advocacy_policy_watch",label:"趁實體活動暫停沉潛做深度政策研究，盯緊紓困特別條例的環保與人權把關條款",sublabel:"聲量較低但累積扎實研究能量，替疫後倡議備妥彈藥",effect:{statsDelta:{energy:-6,purpose:9,capital:9,life:0,impactScore:13}},outcomeText:"你們發布的特別條例監督報告被多位立委引用，成功在預算審查中擋下數項趁疫情夾帶闖關的爭議開發條款。"}]},{id:"era_2020_covid_society",title:"2020 疫情海嘯：年度學術研討會喊卡與繼續教育學分斷鏈危機",category:"era",tag:"台灣時代事件 · 2020",weight:40,isEraEvent:!0,conditions:{yearRange:[2020,2021],excludeOutsideNPO:!0,orgTypes:["academic_society"]},narrative:"三級警戒說來就來，原定五百人的年度學術研討會飯店場地訂金卡死，廠商贊助攤位紛紛喊退；同時數百位執業會員急著湊足年度繼續教育學分換發執照，焦急電話一通接一通打進秘書處。",choices:[{id:"covid_society_virtual_conf",label:"連夜把實體年會全面改成線上視訊研討會，並向主管機關申請核定線上學分簽到",sublabel:"一週內學會視訊導播與線上簽退機制，保住學會年度核心收入與會員換證權益",effect:{statsDelta:{energy:-12,capital:12,purpose:7,life:-4,impactScore:15},milestoneTag:"成功將學會實體年會轉型為線上研討會與學分認證"},outcomeText:"你邊跟飯店談判延用訂金、邊幫十幾位不熟視訊軟體的資深教授做彩排，年會當天零斷線順利落幕，連理監事都對你佩服得五體投地。"},{id:"covid_society_postpone_credits",label:"先向主管機關爭取執業換證學分展延，並將年會延期、改推小型線上專題工作坊",sublabel:"降低一次爆肝轉型的技術風險，但學會年度會費與贊助收入明顯縮水",effect:{orgFinanceDelta:-1,statsDelta:{energy:-6,purpose:5,capital:6,life:0,impactScore:10}},outcomeText:"雖然今年度贊助費少了一大截，但成功爭取到會員學分展延緩衝期，也讓秘書處在最混亂的半年保住基本運作節奏。"}]},{id:"era_2022_inflation_rent",title:"疫後萬物齊漲：蛋價、便當與房租通膨夾擊",category:"era",tag:"台灣時代事件 · 物價飆升",weight:35,isEraEvent:!0,conditions:{yearRange:[2022,2025],excludeOutsideNPO:!0},narrative:"原本巷口八十元的排骨便當漲破一百一，電價與居住開銷又跟著調漲。回頭看組織薪資表，今年的調薪幅度卻只有 0% 到 2%，實質購買力倒退回五年前。全辦公室午休話題只剩下哪裡還有便宜便當與到底要不要轉行。",choices:[{id:"push_cost_of_living_adj",label:"整理主計總處 CPI 數據，聯合同事正式向理監事會爭取通膨調薪",sublabel:"替整個團隊試著爭取制度性調整，不靠個別哀求",effect:{statsDelta:{energy:-6,purpose:5,capital:6,life:2,impactScore:9},salaryDelta:1800},outcomeText:"理監事會看著白紙黑字的物價漲幅表不好意思全部駁回，最終通過每人微調一千八百元伙食津貼，雖然追不上房租，至少感覺沒有被完全無視。"},{id:"tighten_personal_belt",label:"組織帳面實在擠不出錢，只能靠自己搬遠一點通勤與帶便當省錢",sublabel:"減少職場衝突，把財務壓力吞進每日一小時的通勤時間裡",effect:{statsDelta:{energy:-7,purpose:-3,capital:2,life:-5,impactScore:4},savingsDelta:6e3},outcomeText:"你練就了星期天晚上做好五天份備餐便當的本事。帳面多存下幾千塊，只是每天早上要提早四十分鐘出門搭公車。"}]},{id:"era_earthquake_crowdout",title:"重大天災發生後的「善款排擠效應」",category:"era",tag:"台灣公益結構現場",weight:32,isEraEvent:!0,conditions:{yearRange:[2018,2032],excludeOutsideNPO:!0,orgTypes:["grassroots","large_welfare","local_foundation","advocacy_ngo"]},narrative:"台灣發生重大地震與複合災情，全國愛心捐款瞬間大量湧入大型救災專戶。這當然令人欣慰，但你們這種非急難型的日常服務或小型倡議組織，緊接著三個月的單筆捐款與小額轉帳幾乎腰斬。財務會議上沒人敢大聲抱怨，只能苦笑著重算明年預算。",choices:[{id:"collaborate_disaster_support",label:"主動盤點組織專業與災區連結（如身心支持／勞權／地方據點），加入跨團救援網",sublabel:"不搶資源而是補上長期重建缺口，拓展跨界盟友",effect:{statsDelta:{energy:-9,purpose:8,capital:9,life:-2,impactScore:15}},outcomeText:"你們串聯三個友會接手災後第三個月媒體退燒後的長期陪伴工作，不但沒有被邊緣化，反而讓幾位新捐款人看見深耕日常的價值。"},{id:"educate_steady_giving",label:"寫一篇誠實的公開信告訴支持者「日常防護網同樣不能斷電」",sublabel:"溫柔溝通捐款結構問題，盼留住核心定捐護城河",effect:{statsDelta:{energy:-5,purpose:6,capital:5,life:0,impactScore:10},orgFinanceDelta:1},outcomeText:"雖然點閱率遠不如救災新聞，但好幾位老捐款人看完信後悄悄把每月三百元調高成五百元，留言寫著「謝謝你們一直都在」。"}]},{id:"era_ai_and_esg_wave",title:"AI 工具與永續揭露潮：行政縮時還是工作加速？",category:"era",tag:"台灣時代事件 · 2025+",weight:30,isEraEvent:!0,conditions:{yearRange:[2025,2045],excludeOutsideNPO:!0},narrative:"生成式 AI 快速進駐辦公室，公文草稿與會議逐字稿速度翻倍；但主管與{boardNoun}也開始期待「既然現在有 AI，那明年方案數量跟社群貼文是不是可以再多做三成？」同時間大企業永續報告書需求暴增，身邊不斷有同業收到獵人頭邀請。",choices:[{id:"ai_for_worker_relief",label:"將 AI 導入核銷、逐字稿與雙語對照 SOP，堅持把省下的時間拿去補實務與準時下班",sublabel:"善用工具為人減負，而非無限擴張產出指標",effect:{statsDelta:{energy:5,purpose:3,capital:10,life:4,impactScore:11}},outcomeText:"你替辦公室建了一套行政自動化流程，把原本要加班三小時整理的理監事逐字稿壓縮到三十分鐘，還開了一堂課教同業使用。"},{id:"double_output_hustle",label:"用 AI 狂衝研究報告、對外文案與英文資料量，拼出亮眼年度績效",sublabel:"專業籌碼與影響力快速拉升，代價是節奏更快更難喘氣",effect:{statsDelta:{energy:-9,purpose:4,capital:12,life:-5,impactScore:16}},outcomeText:"這季產出的報告量創下組織五年紀錄，但也讓你感受到演算法與高速度時代下，思考反而更難沉澱的焦慮。"}]},{id:"life20_rent_hike",title:"房東來訊：「下個月續約房租調漲 3,000 元」",category:"life",tag:"居住成本現實",weight:18,conditions:{minAge:22,maxAge:34,housing:["studio_rent","shared_room"]},narrative:"下班走進電梯剛好收到房東 LINE 訊息，以「稅金與附近行情上漲」為由通知續約每月加租三千元。這筆錢幾乎吃掉你去年好不容易才爭取到的全部調薪，讓你不得不重新盤算自己的居住與職涯選擇。",choices:[{id:"downgrade_shared_room",label:"咬牙搬去離捷運更遠的雅房或合租公寓，把月租壓下來保住現金流",sublabel:"省下房租差額，代價是通勤變長、室友生活習慣磨合",effect:{housing:"shared_room",statsDelta:{energy:-6,life:-5,capital:1},savingsDelta:4e3},outcomeText:"週末叫了一台小貨車把紙箱搬去老公寓四樓。房間小了一半，但每個月多出四千元喘息空間，不用再月底看著超商貨架算卡路里與價格。"},{id:"apply_subsidy_and_stay",label:"保留獨立小套房保住下班後的完整修復空間，研究並申請租屋補助",sublabel:"生活品質維持住，但每個月存款幾乎原地踏步",effect:{housing:"studio_rent",statsDelta:{energy:4,life:5},savingsDelta:-3e3},outcomeText:"經過跟房東來回協商終於辦過租屋補助，雖然還是多貼了點錢，但下班關上門那刻完全屬於自己的安靜，是支撐你隔天繼續面對人群的防空洞。"}]},{id:"life20_cny_relatives",title:"過年圍爐親戚連環問：「你在{orgNoun}上班，一個月領多少？」",category:"life",tag:"家庭與社會認同",weight:16,conditions:{minAge:22,maxAge:32,excludeOutsideNPO:!0},narrative:"除夕夜飯桌上，剛領完六個月科技業年終的表弟正在聊新車頭期款，大伯轉過頭問你：「阿你在那個{orgNoun}上班，算不算在當義工？聽說領不到三萬多喔，要不要叫姑丈幫你介紹去公司當行政？」爸媽在旁邊默默扒飯沒說話，但你知道他們其實也在擔心你的未來。",choices:[{id:"explain_professionally",label:"不卑不亢解釋非營利部門與人民團體的專業價值與自身累積",sublabel:"練就溫柔反擊的話術，回家心裡還是有點酸澀",effect:{statsDelta:{energy:-4,purpose:6,capital:3,life:-2}},outcomeText:"你拿手機給他們看你們推動的法案或幫師傅追回職災給付的新聞，大伯聽完「喔喔」兩聲轉移話題；深夜媽媽悄悄塞給你一個兩千塊小紅包說「自己買點補品」。"},{id:"laugh_it_off_reflect",label:"笑笑說「夠吃飯啦」草草帶過，晚上卻忍不住開始認真算自己的十年職涯帳",sublabel:"避免過年吵架，開始重視財務規劃與未來出路",effect:{statsDelta:{energy:-3,purpose:-3,capital:4,life:1}},outcomeText:"那晚你躺在老家床上用手機試算如果一直領三萬八到四十歲會發生什麼事，第一次認真思考要在這個圈子走下去，自己需要什麼條件。"}]},{id:"life20_reunion_comparison",title:"大學同學會：大家聊股票與預售屋，你剛忙完{weekendTask}",category:"life",tag:"同儕差距感",weight:15,conditions:{minAge:24,maxAge:33,excludeOutsideNPO:!0},narrative:"剛結束加班趕在最後一刻衝進熱炒店時，已經遲到四十分鐘。同桌大學好友有人年薪破百萬正在看重劃區兩房，有人準備去外商報到。大家客氣地舉杯說「真的好佩服你待在{orgNoun}這麼有熱忱，不像我們都被資本主義綁架」，但結帳分攤每人一千二的聚餐費時，你還是下意識算了一下這個月剩多少預算。",choices:[{id:"embrace_own_pace",label:"誠實分享自己工作上的荒謬趣事與成就，不把「清高」或「自卑」掛在臉上",sublabel:"練習與不同人生軌道的朋友平等相處",effect:{statsDelta:{energy:1,purpose:5,capital:3,life:4}},outcomeText:"聊開以後才發現當工程師的朋友其實也每天失眠、羨慕你工作真的看得到「人」。散場時一位好友說下次聚餐一定要多聽你聊聊{orgNoun}現場的故事。"},{id:"retreat_into_bubble",label:"覺得話不投機早早藉口離開，默默縮回只跟圈內人取暖的同溫層",sublabel:"減少被比較的刺痛，但也漸漸失去理解外界的窗口",effect:{statsDelta:{energy:-3,purpose:2,capital:-2,life:-5}},outcomeText:"回家路上你滑著同業吐槽社團才覺得鬆了一口氣，卻隱約擔心自己會不會越活世界越小。"}]},{id:"life20_partner_weekend_fight",title:"親密關係警報：連續第三個週末因{weekendTask}取消約會",category:"intertwined",tag:"工作與愛情衝突",weight:17,conditions:{minAge:23,maxAge:38,relationship:["single","dating"],excludeOutsideNPO:!0},narrative:"原本約好這週六去看電影吃飯，但星期四下午突然接到週末緊急加班支援（{weekendTask}）。當你傳訊息說「抱歉這週六又不行」時，對方已讀了十分鐘才回：「你到底是在跟組織談戀愛，還是跟我？」",choices:[{id:"swap_shift_keep_date",label:"硬著頭皮跟主管同事調班或只去半天，晚上無論如何趕回來陪對方",sublabel:"向組織示範「工作者也有私生活」，守護重要關係",effect:{relationship:"dating",statsDelta:{energy:-5,purpose:-1,capital:1,life:10}},outcomeText:"你在現場忙完上午場就跟同事交接趕回市區。晚上吃到那頓遲來卻安靜的晚餐時，對方緊繃的肩膀終於軟了下來。"},{id:"prioritize_duty",label:"告訴對方「這個現場現在真的不能沒有我」，承諾下個月再補請吃大餐",sublabel:"完成工作責任，卻在關係帳戶裡留下一筆赤字",effect:{statsDelta:{energy:-6,purpose:4,capital:3,life:-11,impactScore:6}},outcomeText:"週末任務圓滿結束了，但回家打開手機只看到對方傳來「沒關係你忙吧」五個字，冷戰持續了整整兩週。"}]},{id:"life20_first_thank_you",title:"差點提離職的夜晚，抽屜裡收到一封親筆謝卡",category:"intertwined",tag:"使命感微光",weight:15,conditions:{minAge:22,maxAge:35,minTenure:1,maxPurpose:75,excludeOutsideNPO:!0},narrative:"連著三個月被行政雜務、低薪與無止盡的表格磨到懷疑人生，這天正打算把寫好的離職信存進隨身碟時，在信箱裡看到一封半年多前你經手幫助過的{targetNoun}親筆寄來的明信片，上面歪歪扭扭寫著你的名字與一句「幸好那時候你沒有掛我電話」。",choices:[{id:"pin_on_desk",label:"把卡片夾在辦公桌隔板上，決定再陪這個現場走一段路",sublabel:"非營利圈最致命也最溫柔的「續命電力」",effect:{statsDelta:{energy:5,purpose:12,life:2,impactScore:8}},outcomeText:"雖然薪水明天依然不會變高、憑證還是得一張張貼，但至少今晚回家時你不再覺得自己過去一年白費了。"},{id:"cherish_but_stay_clear",label:"好好收進抽屜作為禮物，但提醒自己不能只靠情緒價值撐過結構性低薪",sublabel:"保持清醒邊界：珍惜感動，同時持續為合理待遇發聲",effect:{statsDelta:{energy:3,purpose:7,capital:5,life:3}},outcomeText:"你替那張卡片拍了照存檔，然後回頭在筆記本寫下明年向組織爭取調薪與補休制度的具體清單。"}]},{id:"life20_grad_school_cert",title:"進修與證照交叉口：要不要攻讀{certGoal}？",category:"intertwined",tag:"專業資本投資",weight:16,conditions:{minAge:24,maxAge:39,minTenure:1,requiresNoCert:!0,excludeOutsideNPO:!0},narrative:"工作幾年下來明顯感覺到「只靠熱情做不長久」，這季你認真評估起報名「{certGoal}」，希望能替自己在組織敘薪或未來跨界談判多加一張硬底氣。但下定決心代表未來兩三年每個下班與週末都要繳學費兼熬夜讀書。",choices:[{id:"enroll_and_grind",label:"報名進修考照！花四萬塊學費與兩年下班時間投資自己",sublabel:"存款一次減少 $40,000，取得專業證照資格並加速未來加薪籌碼",effect:{savingsDelta:-4e4,hasProfessionalCert:!0,salaryDelta:2500,statsDelta:{energy:-11,capital:15,purpose:5,life:-6,impactScore:10},milestoneTag:"完成{certGoal}"},outcomeText:"兩年來在公車上背法條、週末窩圖書館改論文差點掉光頭髮，但拿到證書與學歷敘薪加給的那天，你第一次在履歷表前感到踏實。"},{id:"learn_on_job",label:"暫不背額外學費與論文債，改用免費實務社群與跨界案例累積作品集",sublabel:"守住存款與下班睡眠，靠實戰戰績說話",effect:{statsDelta:{energy:3,capital:6,life:4,impactScore:5}},outcomeText:"你把學費省下來當緊急預備金，同時建立起自己的專案與實務案例資料庫，一樣成為圈內搶手的實戰派。"}]},{id:"life30_marriage_and_housing",title:"三十歲的現實試算：論及婚嫁與購屋／租屋現實攤牌",category:"life",tag:"三十世代門檻",weight:18,conditions:{minAge:29,maxAge:40,relationship:["single","dating"],excludeOutsideNPO:!0},narrative:"身邊與伴侶走到談論未來的階段，雙方坐下來拿計算機算帳：以你目前在民間組織的薪資與存款，加上都會區房價與成家支出，若不靠家裡奧援幾乎買不起房；對方的家人也委婉探問「你們這樣婚後生活穩不穩定」。",choices:[{id:"partner_rent_solidarity",label:"坦誠攤開彼此財務底線，決定不當屋奴、婚後先長期租屋保住生活彈性",sublabel:"組成務實的雙薪夥伴家庭，減少過早被千萬房貸鎖死的焦慮",effect:{relationship:"married",housing:"studio_rent",savingsDelta:-3e4,statsDelta:{energy:2,purpose:4,capital:2,life:12},milestoneTag:"步入婚姻並維持財務彈性不強求買房"},outcomeText:"一場沒有豪華婚宴的登記結婚。雖然一樣是無殼蝸牛，但多了一個能互相分擔房租、半夜聽你吐苦水的隊友，孤單感少了一大半。"},{id:"stretch_for_mortgage",label:"咬牙湊出所有存款加上長輩小額借款買下蛋白區老屋背房貸",sublabel:"存款大減 $120,000 且月支出劇增，從此每個月都對薪水高度敏感",effect:{relationship:"married",housing:"mortgage",savingsDelta:-12e4,statsDelta:{energy:-6,purpose:-3,capital:4,life:7},milestoneTag:"咬牙背起房貸成家"},outcomeText:"拿到權狀那天很感動，但看到接下來三十年每個月要自動扣款的房貸金額後，你發現自己再也不敢隨便開口說「大不了老子不幹了」。"},{id:"stay_unmarried_for_now",label:"誠實面對現階段無力承擔成家重擔，決定暫時維持單身或緩談婚約",sublabel:"忠於自己的真實承受力，關係卻也可能因此走到盡頭",effect:{relationship:"single",statsDelta:{energy:-3,purpose:2,life:-7}},outcomeText:"沒有誰錯，只是兩個人對安全感的底線不同。分開後你把更多時間投回工作與自己身上，只是深夜回到租屋處特別安靜。"}]},{id:"life30_parenting_or_leave",title:"迎來新生命與小小辦公室的「育嬰留停焦慮」",category:"intertwined",tag:"育兒與職場結構",weight:17,conditions:{minAge:28,maxAge:42,relationship:["married"],hasChild:!1,excludeOutsideNPO:!0},narrative:"驗孕棒出現兩條線（或迎來領養／家庭新成員）的那一刻又驚又喜，然而隔天走進只有四名專職的辦公室，你立刻想到現實問題：請半年育嬰留停期間組織根本找不到短期代理人，回來後位置還在不在？準公托抽不抽得到？",choices:[{id:"take_parental_leave_rights",label:"依法申請育嬰留職停薪半年，提前三個月寫好交接手冊與外包建議",sublabel:"實踐自己平常也在倡議的勞動權益，克服對組織的罪惡感",effect:{hasChild:!0,childAge:0,savingsDelta:-25e3,statsDelta:{energy:-8,purpose:6,capital:4,life:12,impactScore:6},milestoneTag:"成為父母並依法請領育嬰留停"},outcomeText:"請假期間依然接到過幾通急事求救電話，但看見組織撐過沒有你的半年、且回來時大家給你一個大擁抱，你證明了「非營利工作者也值得擁有完整家庭」。"},{id:"parttime_or_hybrid_parenting",label:"與組織協商暫轉八成工時彈性遠端兩年，領八折薪水兼顧幼兒接送",sublabel:"減少金錢與時間雙邊撕裂，維持專業不斷線",effect:{hasChild:!0,childAge:0,partTimeReduced:!0,salaryMultiplier:.85,statsDelta:{energy:-7,purpose:2,life:10},milestoneTag:"以彈性減班模式兼顧育兒與現場工作"},outcomeText:"雖然薪水打了八五折讓家計緊了一點，但每天下午五點能準時去托嬰中心抱回小孩，在這個高壓行業裡已經是奢侈的幸福。"}]},{id:"life30_relocate_out_of_taipei",title:"逃離天龍國？中南部或家鄉組織開出實務主管缺",category:"intertwined",tag:"區域移動選擇",weight:15,conditions:{minAge:28,maxAge:43,regions:["taipei_metro"],excludeOutsideNPO:!0},narrative:"在雙北租屋工作數年，存摺數字總是跑輸房租漲幅。這時桃竹中南高或東部一間深耕地方的組織邀請你南下接任專案主管，月薪雖然比台北少三千，但當地房租只要台北的一半、而且離年邁父母更近了。",choices:[{id:"move_south_or_home",label:"打包南下／返鄉任職！換取更寬敞的生活空間與照顧家人彈性",sublabel:"地區移往非雙北，月薪微調 -$2,500 但大幅降低房租開銷",effect:{moveRegion:"other_six",salaryDelta:-2500,savingsDelta:-15e3,statsDelta:{energy:8,purpose:3,capital:4,life:11,impactScore:8},milestoneTag:"離開雙北轉往區域組織深耕"},outcomeText:"花三千塊台北雅房的價錢租到一整層兩房公寓，陽台終於照得到太陽。雖然少了不少大台北的跨界交流資源，但下班騎十分鐘就能吃到熱騰騰的晚餐。"},{id:"stay_taipei_hub",label:"留在雙北核心戰場，繼續累積全國性政策與跨會人脈密度",sublabel:"扛住高生活成本，留住最多的資源串聯與跳板機會",effect:{statsDelta:{energy:-4,capital:6,life:-4,impactScore:7}},outcomeText:"你還是繼續搭著板南線通勤。台北確實冷酷又貴，但每次去中央部會、跨界協調會或大型論壇走路搭捷運就到，這份即時現場感讓你暫時捨不得離開。"}]},{id:"life30_best_friend_leaves_npo",title:"入行時的戰友徹底離開非營利圈：深夜居酒屋的長談",category:"life",tag:"價值觀動搖",weight:15,conditions:{minAge:29,maxAge:42,minTenure:3},narrative:"曾經比你更熱血、說好要一起推動台灣改革十年的好友，今天辦完離職手續轉進外商當公關，晚上約你喝兩杯。幾杯啤酒下肚後他紅著眼眶說：「我不是不相信那些價值了，我只是受不了每次生病看醫生都要算這筆掛號費會不會影響下個月房租。」",choices:[{id:"bless_without_guilt",label:"抱抱他告訴他「去好好過生活，你已經替這個圈子撐夠久了」",sublabel:"理解組織結構才是問題而非個人逃兵，也重新整理自己留下的理由",effect:{setFlag:"blessed_departing_friend",statsDelta:{energy:2,purpose:5,capital:3,life:6}},outcomeText:"沒有誰背叛了理想。你們約好半年後就算在不同世界依然要吃飯，你送他上計程車後走回捷運站，覺得心裡寬闊了許多。"},{id:"spiral_into_doubt",label:"嘴上祝福，回家卻整夜失眠反問自己是不是唯一還沒醒過來的傻子",sublabel:"被深層動搖，迫切需要找回自己的意義錨點或重新談待遇",effect:{statsDelta:{energy:-7,purpose:-9,life:-3}},outcomeText:"那一整週進辦公室看到桌上的工作簡章都覺得很刺眼，你把這份自我懷疑壓在心底，默默開始投幾封履歷試水溫。"}]},{id:"life30_student_loan_paid",title:"最後一期學貸扣款通知：終於把青春債還清了",category:"life",tag:"財務解套",weight:18,conditions:{minAge:27,maxAge:40,requiresStudentLoan:!0},narrative:"手機跳出台灣銀行自動扣款成功簡訊，上面顯示「本筆就學貸款已全數清償完畢」。出社會好幾年來，每個月無論薪水再少都先被抽走幾千塊的緊箍咒終於解除，你站在公車站牌下多看了這封簡訊三次。",choices:[{id:"build_emergency_fund",label:"把原本繳學貸的錢全數轉成「拒絕爛工作的底氣預備金」自動定存",sublabel:"不再只是勉強打平，第一次感覺到可以替自己存下一點選擇權",effect:{savingsDelta:15e3,statsDelta:{energy:6,purpose:4,life:9},milestoneTag:"全額清償就學貸款建立緊急預備金"},outcomeText:"存摺數字終於開始每個月確實往上跳一點點。你突然明白，真正的自由不是發大財，而是有底氣對不合理的壓榨說不。"},{id:"treat_self_and_family",label:"帶爸媽或伴侶吃頓好的並安排人生第一趟真正放空的小旅行",sublabel:"好好犒賞撐過最苦頭幾年的自己，修復長期緊繃的神經",effect:{savingsDelta:-8e3,statsDelta:{energy:12,purpose:5,life:11},milestoneTag:"清償學貸後給自己一趟久違的休假"},outcomeText:"去了花東海岸發呆三天、關掉工作通知。回台北時雖然銀行帳戶沒多出多少錢，但整個人像重新開機一樣明亮。"}]},{id:"life40_parent_ltc_crisis",title:"四十歲三明治風暴：父母突發重病失能的長照拉鋸",category:"intertwined",tag:"長照與職場重擊",weight:16,conditions:{minAge:38,maxAge:62,parentCare:["healthy","allowance"],excludeOutsideNPO:!0},narrative:"平常替{targetNoun}奔走各種權益的你，最害怕的電話還是響了——長輩在家跌倒中風住院，出院後需要復健與日間照護。就算申請長照補助與家人分攤，外籍看護、日照與耗材每月仍可能吃掉一兩萬元自付額。你站在醫院走廊算著請假天數與存摺餘額。",choices:[{id:"hire_care_and_apply_ltc",label:"動用長照 2.0 資源並分擔聘請專業看護，自己留在全職位置保住薪水與勞保年資",sublabel:"進入長照自付額重壓期（每月支出顯著增加），用現金換時間",effect:{parentCare:"long_term_care",savingsDelta:-35e3,statsDelta:{energy:-10,purpose:2,capital:4,life:-8,impactScore:6},milestoneTag:"扛起家庭長照 2.0 協調與經濟重擔"},outcomeText:"你把所有公部門長照補助、輔具申請與日照排隊表摸得比社福個案還熟。每個月帳單數字令人心驚，但至少保住了自己的職涯年資與不至崩盤的睡眠。"},{id:"cut_hours_care_personally",label:"與組織協議改為兼職／減班排班（降薪兩成五），自己扛起部分日間照顧",sublabel:"減輕現金支出卻大幅壓縮個人休息與職涯升遷空間",effect:{parentCare:"long_term_care",partTimeReduced:!0,salaryMultiplier:.78,statsDelta:{energy:-15,purpose:1,capital:-4,life:-4},milestoneTag:"減班親力分擔年邁雙親長期照顧"},outcomeText:"每天早上先去幫爸媽備餐與復健再趕去開會，晚上寫案子寫到凌晨。你成了許多統計數字裡那個「沒有離職卻被迫退場邊緣」的中年照顧者。"}]},{id:"life40_health_red_flags",title:"中年健檢滿江紅：自律神經失調與胃潰瘍警告",category:"life",tag:"身體抗議訊號",weight:18,conditions:{minAge:37,maxAge:55},narrative:"拖了三年終於去醫院做完整健檢，報告上血壓、肝指數、胃鏡潰瘍與自律神經失調一口氣亮出四個紅字。醫師盯著螢幕問你：「你是不是長年一天喝兩杯黑咖啡、睡不到六小時又壓力很大？再不改作息，下次就不是在門診看到你了。」",choices:[{id:"mandatory_health_reset",label:"硬起來實行醫療級自我保護：推掉非必要晚宴與兼差，每週固定運動復健",sublabel:"放慢衝刺腳步花錢顧身體，保住下半場職涯本錢",effect:{healthAlert:!1,savingsDelta:-15e3,statsDelta:{energy:14,purpose:1,capital:-2,life:9}},outcomeText:"你把辦公桌抽屜的止痛藥換成溫水壺，晚上九點手機自動轉勿擾。三個月後回診，醫師看著降下來的血壓數字終於露出笑容。"},{id:"take_pills_keep_pushing",label:"拿了三個月慢性病藥
