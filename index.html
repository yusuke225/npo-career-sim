島嶼公共政策監督聯盟"},outcomeText:"你們不收政府標案，靠著幾百位早鳥定捐支持者租下小工作室開張，每一份聲明都能直指核心痛點。"},{id:"support_advocacy_board",label:"考量現有家庭支出婉拒全職離職，改擔任創會理事與義務顧問",sublabel:"保留穩定薪酬，從側翼協助新組織站穩腳步",effect:{statsDelta:{energy:2,purpose:7,capital:7,life:4,impactScore:11}},outcomeText:"你替新組織寫好募款說帖並擔任發起理事，用另一種穩健方式替台灣公民社會開出新支線。"}]},{id:"life40_found_academic_society",title:"自立門戶的召喚：協助跨領域學者發起籌組新興實務研究學會",category:"work",tag:"專業學會創辦",weight:15,conditions:{startOrgTypes:["academic_society"],minAge:34,maxAge:52,minTenure:5,minCapital:55,excludeOutsideNPO:!0},narrative:"隨著跨界專業興起，幾位跟你有深厚交情的年輕教授與臨床專家決定從舊有僵化學會出走，想籌組一個真正重視青年學者與實務工作者對話的新學會：「沒有你這個熟透內政部人團法規跟學分系統的活字典根本立不了案，來當我們首任專任秘書長吧！」",choices:[{id:"co_found_society",label:"接受邀請從零草創！親手替新學會建立民主章程與合理秘書處待遇",sublabel:"存款 -$50,000、轉任新立案專業學會，徹底告別舊理事長派系",effect:{savingsDelta:-5e4,changeOrgType:"academic_society",changeOrgName:"社團法人春山跨界實務學會",roleLevelDelta:1,setRoleTitle:"專任秘書長",statsDelta:{energy:-10,purpose:20,capital:12,life:-5,impactScore:26},boardClimate:"trusting",milestoneTag:"發起籌組並立案春山跨界實務學會"},outcomeText:"你在新學會章程第一條就寫進秘書處合理工時與制度保障，首屆年會雖然借用大學階梯教室克難舉辦，卻座無虛席。"},{id:"support_society_advisor",label:"婉拒全職跳槽，改以人團法規顧問身分協助籌備成立大會並轉回原職",sublabel:"穩住既有人脈與年資，用專業知識協助新社群誕生",effect:{statsDelta:{energy:2,purpose:7,capital:7,life:4,impactScore:11}},outcomeText:"你花兩個週末幫他們搞定內政部籌備公文與線上繳費系統，成為這間新學會最感謝的幕後推手。"}]},{id:"life40_found_new_union",title:"自立門戶的召喚：串聯跨廠區基層勞工發起籌組新興產業工會",category:"work",tag:"工會組織創辦",weight:15,conditions:{startOrgTypes:["industrial_union","occupational_union"],minAge:34,maxAge:52,minTenure:5,minCapital:55,excludeOutsideNPO:!0},narrative:"眼看平台經濟與跨區新興行業勞工長期缺乏工會保障，一群信任你的基層工會代表與配送員找上門：「發起人名冊已經湊齊三十五人了，只要你願意來扛創會秘書長，我們自己向勞動局申請立案成立聯合產業工會！」",choices:[{id:"co_found_union",label:"拿出儲蓄墊付初期抗爭與行政費，陪這群勞工親手立起新工會！",sublabel:"存款 -$50,000、重返工運草創前線，寫下屬於新世代的工會戰旗",effect:{savingsDelta:-5e4,changeOrgType:"industrial_union",changeOrgName:"島嶼跨領域受僱者聯合產業工會",roleLevelDelta:1,setRoleTitle:"創會秘書長",statsDelta:{energy:-10,purpose:20,capital:12,life:-5,impactScore:26},boardClimate:"trusting",milestoneTag:"共同發起立案島嶼跨領域受僱者聯合產業工會"},outcomeText:"從籌備會借咖啡廳角落開會到拿到工會登記證書那天，大家輪流摸著還熱呼呼的印信說：「這次我們真的有自己的家了。」"},{id:"support_union_mentor",label:"考量家庭責任留在原工會位置，改擔任新工會的義務培訓顧問與友會盟友",sublabel:"穩住自身薪資與勞健保，持續用多年談判經驗支援新工會",effect:{statsDelta:{energy:2,purpose:7,capital:7,life:4,impactScore:11}},outcomeText:"你替新工會上完第一堂「如何不被資方抓到籌組漏洞」實戰課，並串聯友會借出第一間臨時辦公桌。"}]},{id:"life40_generation_gap",title:"世代落差現場：新進 Z 世代同事「準時六點下班拒絕收群組」",category:"work",tag:"中生代管理課題",weight:15,conditions:{minAge:36,maxAge:55,excludeOutsideNPO:!0},narrative:"這季新來的年輕專員工作能力不差，但嚴格遵守「五點五十九分收書包、週末不回工作 LINE、拒絕任何未事先申請的臨時加工作業」。昨天一場臨時記者會前夕他依舊準時下班，害你跟另一位老同事默默留下來做到十點。老戰友氣得說「現在年輕人一點使命感都沒有」。",choices:[{id:"rebuild_system_not_guilt",label:"忍住情緒不道德綁架新人，回頭重新檢討「為什麼組織總是靠緊急加班運作」",sublabel:"消化夾心層痛苦，推動真正適合下一代的永續工時設計",effect:{statsDelta:{energy:-6,purpose:7,capital:10,life:4,impactScore:12}},outcomeText:"你跟年輕專員坦白溝通預警期的重要性，同時逼自己與{boardNoun}戒掉「前兩天才臨時改議程」的壞習慣。三個月後，那位新人反而主動提出好幾個高效改善提案。"},{id:"lecture_passion",label:"找新人約談「非營利組織性質不同於一般公司，要有彈性與使命感」",sublabel:"抒發了資深者的無奈，卻讓新人開始默默刷 104 準備離職",effect:{statsDelta:{energy:-5,purpose:-5,capital:-2,life:-3}},outcomeText:"新人禮貌點頭說知道了，但兩個月後試用期滿就提離職，留下一句「謝謝前輩指導，但我還是比較重視生活品質」。"}]},{id:"life40_quit_without_plan",title:"還沒到能退休的年紀，卻已快撐不下去：離職之後到底能轉行去哪？",category:"intertwined",tag:"中生代迷惘離開",weight:14,conditions:{minAge:33,maxAge:54,minTenure:5,maxEnergy:58,excludeOutsideNPO:!0},narrative:"三十多到五十出頭正是雙親漸老、帳單滿身的年紀——遠遠還不到 55 歲可以談退休的時候，更還沒滿 60 歲能領勞退，但日復一日的低薪凍漲、情緒勞動與無效行政已經把最後一點力氣磨平。你看著同事群組裡陸續有人離職後跑去做臨時行政、開小店、跑外送或長期待業摸索，突然發現離開這個圈子後，自己其實也不知道該轉行去哪裡。",choices:[{id:"quit_into_unknown",label:"先遞出辭呈離開再說！就算還不知道要轉行去哪裡，也得先把身心救回來",sublabel:"【直接結算】未達退休年齡的悄然離職，帶著空白與未知重新摸索出路",effect:{statsDelta:{energy:4,purpose:-8,life:6},setFlag:"quit_uncertain_path",endGameReason:"meaning_exit",milestoneTag:"未達退休年齡便遞出辭呈，帶著迷惘告別民間現場"},outcomeText:"同事替你辦了一場安靜的送別午餐，問你「接下來要去哪家單位」時，你只能笑著說「先休息一陣子再打算」。走出辦公大樓那天沒有下一個高薪頭銜等著你，但至少肩膀上的石頭暫時卸下來了。"},{id:"stay_and_drag_on",label:"看著房租與帳單不敢裸辭，只能先請幾天特休喘口氣、繼續邊做邊看",sublabel:"守住眼前微薄但確定的月薪現金流，先把眼前的日子過下去",effect:{statsDelta:{energy:6,purpose:-4,capital:2,life:3}},outcomeText:"你請了三天假把手機關靜音在家睡到飽。回到辦公室那天工作一樣多，但心裡多了幾分「只要不委屈過頭就先做下去」的務實平靜。"}]},{id:"life50_pension_reality",title:"登入勞保局 e 化系統：看見勞退新制專戶數字的那天",category:"life",tag:"老年經濟現實",weight:24,conditions:{minAge:52,maxAge:64},narrative:"某天午休順手插上自然人憑證查詢勞保局專戶。依台灣勞退新制規定，必須年滿 60 歲才能請領個人專戶退休金；回頭看早年非營利圈普遍低薪、甚至曾經歷過高薪低報或承攬空窗期，螢幕上試算出的「滿 60 歲後每月可領金額」比想像中單薄許多。距離法定請領門檻已不算太遠，老後帳單卻讓人靜下心重算一遍。",choices:[{id:"self_contribute_6pct",label:"立刻向會計申請「勞退自提 6%」並調整個人保守型理財配置",sublabel:"減少眼前可支配零用錢，強迫替老年的自己守住基本線",effect:{savingsDelta:-1e4,statsDelta:{energy:1,purpose:1,capital:5,life:5},milestoneTag:"啟動勞退自提 6% 搶救老年預備金"},outcomeText:"扣掉自提後每個月手頭緊了兩三千，但看著專戶數字加速爬升與節稅效果，深夜焦慮總算消退一半。"},{id:"plan_consulting_second_act",label:"規劃「60 歲退下第一線、轉做外部督導／評鑑委員與講師」的第二曲線",sublabel:"善用二十多年實務資歷，延長專業變現年限而不靠死薪水",effect:{statsDelta:{energy:2,purpose:6,capital:8,life:4,impactScore:8}},outcomeText:"你開始整理過往所有的組織章程、核銷範本與案例教案，為十年後的半退休講師生涯鋪好第一塊磚。"}]},{id:"life50_physical_limit",title:"歲月不饒人：連日趕場備戰與長期熬夜的體力真的扛不住了",category:"intertwined",tag:"體力轉折點",weight:22,conditions:{minAge:50,maxAge:64,excludeOutsideNPO:!0},narrative:"又是一個密集忙碌的{weekendTask}檔期。二十幾歲時你能連續跑點奔波、一次搬十幾箱資料與設備走三層樓、熬兩夜趕公文與簡報都不眨眼；今天卻只是多站了幾小時腰椎就隱隱作痛，回家還得貼兩片痠痛貼布。你突然承認，自己不再適合扛在體力消耗的最前排。",choices:[{id:"mentor_young_leaders",label:"退居二線專注經驗傳承、策略協調與把關法規細節，把第一線執行交給年輕一代",sublabel:"角色成功轉型：從「親自做完」變成「讓團隊做得到」",effect:{statsDelta:{energy:8,purpose:8,capital:7,life:7,impactScore:12},milestoneTag:"順利完成第一線體力勞動退位與經驗傳承"},outcomeText:"看著年輕同仁自信站上前線挑大樑的那天，你在後排默默替大家顧好後勤與聯絡細節。那種不必自己事必躬親卻看著組織制度延續下去的踏實，是年輕時體會不到的。"},{id:"refuse_to_slow",label:"覺得新人還不夠穩、不放心放手，依然事必躬親衝第一線",sublabel:"組織暫時不出錯，但既傷自己身體也拖慢了下一代接班",effect:{statsDelta:{energy:-12,purpose:2,capital:-2,life:-7,impactScore:6}},outcomeText:"大家依然習慣大事小事都喊你救火，然而腰傷復發請假一週時，整個辦公室幾乎癱瘓，這才驚覺不放手本身就是最大風險。"}]},{id:"life50_succession_handover",title:"組織交棒時刻：要不要相信這群還有些青澀的接班人？",category:"work",tag:"55+ 世代交棒",weight:26,conditions:{minAge:55,maxAge:65,minTenure:8,minOrgYears:4,minRoleLevel:1,excludeOutsideNPO:!0},narrative:"在這個生態走過四分之一個世紀，如今理監事與後輩都敬你三分。然而眼前培養了四年的接班人選，作風與你大不相同——他們想把行之有年的紙本流程全面數位化、砍掉你當年一手建立的某些傳統做法。是趁還沒離開前出手擋下，還是真的放手讓屬於他們的組織長出來？",choices:[{id:"graceful_handover",label:"寫完最後一份完整的交接備忘錄後笑著放手，甚至開始考慮體面退休",sublabel:"完成「制度交棒」最後一哩路，將主導權交給下一世代",effect:{statsDelta:{energy:10,purpose:12,capital:6,life:12,impactScore:16},milestoneTag:"完成跨世代組織記憶交棒"},outcomeText:"你把二十年的憑證邏輯、會員人脈眉角與法規地雷整理成一本《組織生存說明書》交給他們，心想：組織不該屬於某個老人，它要自己長出新的樣子。"},{id:"graceful_retire_now",label:"確定交接就緒後，提前辦理榮譽退休／轉任不支薪顧問為職涯謝幕",sublabel:"【圓滿結算】以「體面交棒與退休」作為本段職涯結局",effect:{statsDelta:{energy:12,purpose:14,life:14,impactScore:18},endGameReason:"retired_gracefully",milestoneTag:"成功交棒後體面退休謝幕"},outcomeText:"歡送茶會那天沒有太悲情的感言，年輕同仁送你一本簽滿名字的相冊。走出辦公大樓大門時陽光剛好落下來，這段漫長卻沒白走的路，就先交給你們了。"}]},{id:"life_all_burnout_alarm",title:"週一早上在捷運站月台突然呼吸急促：身心亮起紅燈",category:"intertwined",tag:"耗竭預警",weight:26,conditions:{maxEnergy:32},narrative:"這幾個月積累的案量、核銷、櫃檯衝突或家庭壓力終於在今天早上爆發——明明沒趕時間，站進捷運車廂門關上的瞬間卻突然胸悶心悸、眼淚止不住掉下來，只好在下一站衝出來坐在月台椅子上發抖。",choices:[{id:"take_sick_leave_therapy",label:"立刻請特休或無薪休養兩週，預約身心科與心理諮商好好停下來",sublabel:"花費 $8,000 醫療諮詢費，緊急搶救墜谷的身心能量",effect:{savingsDelta:-8e3,statsDelta:{energy:26,purpose:3,life:10},milestoneTag:"誠實面對職業倦怠並透過休養止血"},outcomeText:"諮商師說了一句讓你爆哭的話：「你替那麼多人扛住了世界，卻忘記自己也是一條需要被照顧的人命。」兩週後重新開機，你終於知道何時必須踩煞車。"},{id:"push_through_burnout",label:"擦乾眼淚去超商買了止痛藥和黑咖啡，搭下一班車硬撐進辦公室開早會",sublabel:"維持表面正常運作，但離全面崩潰只剩一步之遙",effect:{statsDelta:{energy:-8,purpose:-7,life:-8}},outcomeText:"沒有人發現你早上在月台哭過。你照常開完會、微笑接完三通電話，只是晚上回家看著牆壁發呆了兩個小時卻什麼也想不起來。"}]},{id:"life_all_cross_sector_workshop",title:"受邀擔任外部培訓講師：原來你在民間磨練出的本事這麼值錢",category:"intertwined",tag:"專業自信回復",weight:13,conditions:{minTenure:3,minCapital:42,excludeOutsideNPO:!0},narrative:"某大學相關科系或友會邀你去分享實務經驗（{lectureTopic}），並提供一筆體面的外聘講師費。上台前你還覺得「自己做的事這麼平凡有什麼好講」，結果台下幾十位學員筆記抄不停、會後排隊發問了半小時。",choices:[{id:"build_lecture_brand",label:"把經驗系統化成講義，開始建立個人專業講師與外部督導口碑",sublabel:"賺到外快 $12,000 並大幅拉升業界人脈與自信",effect:{savingsDelta:12e3,statsDelta:{energy:-4,purpose:9,capital:11,life:2,impactScore:12}},outcomeText:"原來每天在泥淖裡摸索出來的報表邏輯、溝通眉角與法規解法，在別人眼裡都是千金難買的實務資產。你的眼神久違地重新亮了起來。"},{id:"donate_or_share_openly",label:"把整份簡報模板開源分享給各小團體免費下載，保留適度接課節奏",sublabel:"進帳 $6,000 同時大幅放大對整體生態的正向影響力",effect:{savingsDelta:6e3,statsDelta:{energy:-1,purpose:11,capital:7,life:4,impactScore:16}},outcomeText:"好幾位遠在花東與離島的專職人員私訊謝謝你的模板幫他們省下好幾天摸索時間——這大概就是民間部門最可愛的互助文化。"}]},{id:"life_all_meaning_crisis",title:"夜深後的意義拷問：「我做這一切，結構真的有變好一公釐嗎？」",category:"intertwined",tag:"理想空洞時刻",weight:24,conditions:{maxPurpose:50,excludeOutsideNPO:!0},narrative:"又忙完一輪{weekendTask}，下週結構問題依舊原地打轉；好不容易熬夜交出專案與報告，卻彷彿沒人真正看見{targetNoun}的處境。你坐在書桌前望著熄掉的螢幕，突然徹底感受不到這些努力的意義。",choices:[{id:"seek_peer_support_circle",label:"約三位跨組織老朋友去吃熱炒，老實承認自己「理想沒電了」",sublabel:"停止獨自消化結構無力感，向同行夥伴借一點光",effect:{statsDelta:{energy:4,purpose:18,life:7}},outcomeText:"大家一輪輪罵完官僚、資方與大環境後竟笑成一團。原來不是你一個人覺得荒謬，而願意一起承認「沒辦法馬上改變世界，但今天先守住旁邊這個人」，反而讓你重新站回地面。"},{id:"keep_numb_routine",label:"告訴自己「上班就只是上班」，把心徹底關起來只當一份領薪水的行政活",sublabel:"不再那麼容易受傷，但離開組織的倒數計時也悄悄開始",effect:{statsDelta:{energy:3,purpose:-8,capital:1,life:2}},outcomeText:"你的效率變高了、也不再為任何人掉眼淚，只是每次在公開場合聽見新人談理想時，心底只剩下一聲很輕很輕的嘆息。"}]},{id:"life_all_family_loan_request",title:"老家急電：親戚周轉或長輩醫療需要一筆六萬元急用",category:"life",tag:"突發家庭支出",weight:14,conditions:{minSavings:45e3},narrative:"正慶幸今年終於多存下一點緊急預備金，媽媽卻在電話那頭支支吾吾說爸爸牙科植牙或家裡老屋漏水急需一筆大修費，問你手頭方不方便先支援六萬元。這幾乎是你半年才存下來的全部積蓄。",choices:[{id:"cover_in_full",label:"直接匯出六萬元替家裡解圍，自己接下來幾個月再省一點",sublabel:"存款 -$60,000，讓父母安心、自己再度回到低水位焦慮",effect:{savingsDelta:-6e4,statsDelta:{energy:-4,purpose:2,life:6}},outcomeText:"媽媽在電話那頭不斷說「等領到錢一定還你」，但你們彼此都知道不用還。看著重新縮水的帳戶數字，你默默把原本要買的筆電延後到明年。"},{id:"split_and_apply_aid",label:"先出三萬，同時發揮專業幫家裡查清楚縣市政府修繕補助或分期方案",sublabel:"存款 -$30,000，用專業知識守住自己最後的緩衝墊",effect:{savingsDelta:-3e4,statsDelta:{energy:-3,capital:4,life:4}},outcomeText:"你替家裡查到長輩輔具／修繕補助省下兩萬多，自己只貼補了三萬塊，既幫上忙也沒有把自己掏空。"}]},{id:"life_all_unexpected_joy",title:"一個沒有任何急事的週五下午：整個辦公室意外提前放風",category:"life",tag:"難得喘息",weight:12,conditions:{minTenure:1,excludeOutsideNPO:!0},narrative:"年度重大計畫與會議都剛順利交卷，下午三點半{bossTitle}罕見地走出來說：「大家這季辛苦了，沒急事的話四點就各自收一收提前下班吧。」外頭剛好是微涼的晴天。",choices:[{id:"walk_in_sunshine",label:"去逛平日總是關門的小書店與市場，替自己煮一頓完整的晚餐",sublabel:"替枯竭的身心與生活感同時補回大量電量",effect:{statsDelta:{energy:14,purpose:6,life:12}},outcomeText:"原來下午四點的街道長這個樣子！你坐在公園長椅上曬著太陽吃豆花，突然重新喜歡上這座城市與自己的生活。"},{id:"catch_up_sleep",label:"回家拉上窗簾一口氣睡到隔天早上十點，還清這幾個月的睡眠債",sublabel:"極致純粹的物理修復",effect:{statsDelta:{energy:20,life:6}},outcomeText:"睡滿十二個小時醒來時頭腦無比清醒，肩膀的僵硬少了一大半，又可以回去面對下週的挑戰了。"}]},{id:"life20_side_gig_burnout",title:"下班後的副業外包：多賺八千元卻快把最後一絲熱情磨光",category:"life",tag:"經濟補貼代價",weight:14,conditions:{minAge:23,maxAge:36,maxSavings:18e4,excludeOutsideNPO:!0},narrative:"為了應付都會生活費與孝親壓力，這幾個月下班後你又接了文字校對與週末活動兼職打工，每月確實多擠出八千塊入袋。但已經連續五週沒有睡超過六小時，白天在原組織開會時腦袋常常一片空白。",choices:[{id:"pause_side_gig",label:"先停掉高耗能副業三個月，把體力拿回來準備談正職調薪或轉職",sublabel:"捨棄短期八千元現金流，避免「正職低薪＋副業過勞」雙輸循環",effect:{statsDelta:{energy:14,purpose:3,capital:4,life:8}},outcomeText:"停掉兼差的第一個週末你睡醒看著窗外陽光，突然恢復了思考能力，還順便改好了一份漂亮的專業履歷。"},{id:"keep_grinding_savings",label:"存款數字還沒有安全感，咬牙繼續兼差把預備金存到下一階段",sublabel:"現金立刻增加 $18,000，但身心耗損持續擴大",effect:{savingsDelta:18e3,statsDelta:{energy:-13,purpose:-5,life:-9}},outcomeText:"看著帳戶終於多出兩萬塊緩衝心安了一點，只是下班後面對螢幕的那種乾嘔感越來越頻繁。"}]},{id:"life30_sibling_care_argument",title:"家庭群組的沉默分工：「你在那個比較彈性的{orgNoun}，爸媽看醫生就你去吧」",category:"intertwined",tag:"家庭性別與職涯偏見",weight:15,conditions:{minAge:30,maxAge:46,excludeOutsideNPO:!0},narrative:"父母年紀漸長、回診頻率變高。週末家族聚餐時，在科技業或銀行上班的手足順理成章地說：「我們請假扣薪很重啦，你在那個{orgNoun}比較沒那麼賺錢、時間也比較自由，平日陪診就交給你跑比較划算。」",choices:[{id:"set_fair_family_ledger",label:"直接算出自己請特休的時間成本與勞務價值，要求手足「出錢分擔或輪流請假」",sublabel:"打破「領比較少的人時間比較不值錢」的家庭迷思",effect:{savingsDelta:8e3,statsDelta:{energy:-3,purpose:4,capital:3,life:5}},outcomeText:"雖然當場氣氛僵了三分鐘，但後來哥哥／姊姊終於同意每月多出五千元請接送復康與計程車，不再把你的時間當成免費資源。"},{id:"absorb_quietly_out_of_guilt",label:"覺得反正自己真的薪水比較低不好意思爭，默默把平日陪診全接過來",sublabel:"家庭暫時沒吵架，卻在職場頻繁請假與個人睡眠間雙重壓扁自己",effect:{statsDelta:{energy:-11,purpose:-2,life:-6}},outcomeText:"每個禮拜三早上在醫院候診區用筆電回工作訊息成了你的日常。有時候真的分不清自己是在照顧世界、還是被所有人理所當然地依賴。"}]},{id:"life30_housing_or_mobility",title:"三十五歲的分叉：要不要為了「老家有免費房子」回去領低薪？",category:"life",tag:"返鄉與發展拉鋸",weight:13,conditions:{minAge:31,maxAge:42,minTenure:4,housing:["studio_rent","shared_room"],regions:["taipei_metro","other_six"],excludeOutsideNPO:!0},narrative:"老家那邊的{hometownOrg}開了一個缺，薪水比都會區少六千，但回家住老宅就能免去每月一萬多塊房租，順便顧家。然而一旦回去，就意味著退出過去累積十年的都會人脈圈與政策核心。",choices:[{id:"move_rural_rooted",label:"搬回非六都家鄉據點深耕！把省下來的房租轉成真正的個人存款",sublabel:"轉入非六都與偏鄉組織，月薪 -$5,500 但居住成本大降",effect:{moveRegion:"non_six_rural",housing:"with_parents",salaryDelta:-5500,statsDelta:{energy:6,purpose:5,capital:-2,life:9,impactScore:10},milestoneTag:"返鄉轉赴非六都第一線現場深耕"},outcomeText:"雖然週末少了很多藝術展與論壇可跑，但看著每個月實際存下來的金額與早晨窗外的稻田或海線，你終於不再覺得被房租追著跑。"},{id:"stay_urban_network",label:"維持現行都會區發展軌道，相信多元機會長期仍能帶來更好的專業回報",sublabel:"承擔高房租壓力，保留職涯跨界與政策參與上限",effect:{statsDelta:{energy:-2,capital:5,life:-2,impactScore:5}},outcomeText:"你婉拒了家鄉那份缺，繼續在都會叢林裡打拼，偶爾搭高鐵回去吃一頓媽媽煮的菜再北上。"}]},{id:"life40_child_school_transition",title:"孩子的補習班與才藝帳單：第一次感受到低薪對下一代的壓力",category:"life",tag:"家庭教育開銷",weight:14,conditions:{minAge:36,maxAge:52,hasChild:!0,excludeOutsideNPO:!0},narrative:"孩子準備升國中或進入花錢的學齡期，同學都在上英文補習班與暑期營隊。看著繳費單與家裡每個月勉強打平的收支表，孩子懂事地說「其實我不用去補習班沒關係」的那一刻，你心裡突然揪了一下。",choices:[{id:"invest_in_kid_carefully",label:"擠出儲蓄與接外快講師費替孩子報關鍵資源，自己再少買幾件新衣",sublabel:"存款 -$25,000，把省下的資源優先留給孩子教育選擇",effect:{savingsDelta:-25e3,statsDelta:{energy:-5,purpose:2,life:8}},outcomeText:"雖然這個季度的個人存摺縮水了，但看見孩子開心地背著書包去上他喜歡的社團課，你覺得那些熬夜接案講課都值得。"},{id:"community_and_public_resources",label:"善用社區圖書館、公部門免費青年中心與友會交換資源，不盲從焦慮軍備賽",sublabel:"發揮民間工作者的找資源超能力，省錢同時教會孩子生活素養",effect:{statsDelta:{energy:-3,purpose:5,capital:3,life:6}},outcomeText:"你帶孩子一起參加免費的博物館導覽與社區足球隊，省下大筆補習費，還意外跟幾位同樣務實的家長成了好朋友。"}]},{id:"life40_old_mentor_illness",title:"帶你入行的資深前輩病倒了：去醫院探望看見他一生的清貧與尊嚴",category:"intertwined",tag:"前輩的鏡子",weight:14,conditions:{minAge:36,maxAge:56,minTenure:5},narrative:"當年手把手帶你入行、陪你一起{fieldMove}的資深前輩住進了加護病房。他奉獻了三十年給台灣民間組織與基層現場，名下沒有房產、存款有限，病房外擠滿了各單位趕來輪班照顧的後輩。看著病床上的他，你彷彿看見某種版本的未來。",choices:[{id:"organize_mutual_aid_fund",label:"協助揪同業發起前輩急難醫療互助，同時立誓要替這一代建立合理的退休與待遇文化",sublabel:"把震撼化為制度行動，拒絕讓奉獻者老無所終成為浪漫神話",effect:{savingsDelta:-6e3,statsDelta:{energy:-5,purpose:10,capital:7,life:2,impactScore:13},milestoneTag:"發起前輩醫療互助並推動同業勞動保障文化"},outcomeText:"不到三天大家就湊齊醫藥與看護費。那天傍晚你坐在醫院走廊寫下：「敬重前輩的最好方式，就是不讓下一代重複一樣的貧窮燃燒。」"},{id:"rethink_own_safety_net",label:"默默包了一包紅包陪伴家屬，回家後立刻重整自己的保險與退休試算表",sublabel:"從前輩身上看清結構現實，先把自己的安全網補牢",effect:{savingsDelta:-8e3,statsDelta:{energy:1,purpose:2,capital:5,life:6}},outcomeText:"你替自己補齊了實支實付與長照基本保障，清楚提醒自己：照顧別人的前提是老後不要成為組織與家人的負擔。"}]},{id:"life50_peer_legacy_reunion",title:"入行二十年小聚：當年一起受訓的十個人，現在只剩兩個還在這個圈子",category:"intertwined",tag:"歲月同溫層對照",weight:16,conditions:{minAge:43,maxAge:62,minTenure:12,excludeOutsideNPO:!0},narrative:"當初同一梯進非營利與人民團體培訓班的十個年輕人，二十年後在台北一家老台菜館重聚。桌上有人是外商永續長、有人在部會當簡任官、有人回家接便當店，只剩你跟另一位老夥伴還留在民間組織第一線。大家笑談往事，空氣裡有種說不出的複雜情感。",choices:[{id:"proud_of_long_haul",label:"坦然舉杯致敬所有留在現場與離開的人：「每個階段的我們都盡力過了」",sublabel:"和解所有的比較與遺憾，確認自己走出一條無愧於心的長路",effect:{savingsDelta:-2e3,statsDelta:{energy:5,purpose:13,capital:5,life:9,impactScore:10}},outcomeText:"散場時那位跨去外商的朋友用力抱了你一下：「幸好還有你們留在那邊，我們才敢說台灣公民社會還在。」"},{id:"leverage_cross_network",label:"趁機建立「畢業校友資源聯盟」，請已經在企業與公部門的同學固定反哺現場",sublabel:"把二十年同梯人脈轉化成實質跨界支援網路",effect:{savingsDelta:-2e3,statsDelta:{energy:1,purpose:8,capital:12,life:5,impactScore:16},orgFinanceDelta:1},outcomeText:"那頓飯最後變成一場熱血的資源對接會——兩個月後真的有一筆企業設備捐贈與跨部會諮詢因為這群老同學而促成。"}]},{id:"life_all_gov_committee_invite",title:"受邀擔任縣市政府／中央部會「民間委員或審查委員」",category:"work",tag:"體制內外對話",weight:13,conditions:{minTenure:5,minCapital:48,excludeOutsideNPO:!0},narrative:"累積多年的專業口碑終於被看見，主管機關來函邀請你以專家或民間團體代表身分出任為期兩年的委員會成員。雖然每次開會只有兩千五百元出席費、還得讀厚厚兩百頁議程資料，但這是少數能在體制內直接審預算與挑毛病的位子。",choices:[{id:"accept_watchdog_seat",label:"接下委員聘書！把第一線看過的所有核銷荒謬與現場痛點帶進會議室質詢官員",sublabel:"專業聲望與影響力大增，每次開會前要熬夜讀完大量公文",effect:{savingsDelta:1e4,statsDelta:{energy:-8,purpose:10,capital:12,life:-3,impactScore:18},milestoneTag:"獲聘擔任政府民間委員／審查委員"},outcomeText:"第一次坐進部會會議室發言時手心還有點出汗，但當你點出某項補助辦法的盲點並真的寫進修正紀錄時，覺得過去十年的苦都變成子彈了。"},{id:"decline_avoid_cooptation",label:"擔心進去當委員反被「背書摸頭」且分身乏術，禮貌婉拒專心守住外部監督角色",sublabel:"保留完整批判自由與下班時間",effect:{statsDelta:{energy:3,purpose:5,capital:2,life:4,impactScore:7}},outcomeText:"你把時間留給組織本業與生活，同時維持寫評論自由痛批政策不合理處的彈性，不必為了會議和諧而吞下妥協。"}]},{id:"life_all_housing_emergency_repair",title:"生活突發狀況：通勤機車報廢或住處冷氣漏水大修",category:"life",tag:"生活意外開銷",weight:14,conditions:{minTenure:1,excludeOutsideNPO:!0},narrative:"本來就抓得很緊的月份，偏偏通勤{fieldMove}的老機車半路拋錨大修或報廢，或者家裡老舊家電突然壞掉得自己貼錢換新。兩三萬元的意外支出，對沒有高年終緩衝的非營利工作者來說格外刺痛。",choices:[{id:"buy_reliable_replacement",label:"咬牙花三萬五買可靠二手代步車或修繕到位，不讓每天通勤安全出問題",sublabel:"存款 -$35,000，確保日常交通與安全無虞",effect:{savingsDelta:-35e3,statsDelta:{energy:2,life:3}},outcomeText:"看著網銀扣款還是心痛了一下，但至少雨天騎車跑現場不用再提心吊膽怕半路熄火。"},{id:"finance_vehicle_installment",label:"手頭現金吃緊改辦分期付款換購新機車／代步工具（零頭款分 24 期）",sublabel:"不一次掏空存款，但往後兩年每月固定多出一筆 $2,800 車貸月繳",effect:{addCarLoan:{totalAmount:67200,monthlyPayment:2800},statsDelta:{energy:2,life:1}},outcomeText:"辦完分期後先把眼前交通危機壓了下來，只是每月帳本又多了一條車貸扣款提醒你別輕易辭職。"},{id:"switch_public_transit_temporarily",label:"先暫時靠公車、Ubike 與捷運硬撐幾個月，把現金留著應付更緊急的帳單",sublabel:"只花 $4,000 交通月票，代價是每日多耗一小時體力通勤",effect:{savingsDelta:-4e3,statsDelta:{energy:-8,life:-5}},outcomeText:"省下了三萬塊，但也開始在夏天的正中午背著電腦追公車、趕場勘，體會什麼叫「沒錢只能拿體力換時間」。"}]},{id:"life_expense_may_tax_and_weddings",title:"五月報稅季撞上三張紅色炸彈：帳戶瞬間少掉半個月薪水",category:"life",tag:"日常開銷衝擊",weight:16,conditions:{minAge:25,maxAge:45},narrative:"五月才剛刷完綜合所得稅、機車燃料稅與牌照稅，同一個禮拜桌曆上又連續出現大學同學、前同事與表妹的三場喜宴。紅包行情一張比一張高，看著網銀餘額數字，這個月連一杯手搖飲都要猶豫三秒。",choices:[{id:"attend_and_pay_full",label:"人情還是得顧：照行情包完紅包並如期繳清稅單，勒緊褲帶過下個月",sublabel:"存款一次減少 $18,000，守住親友與同儕人情",effect:{savingsDelta:-18e3,statsDelta:{energy:-3,life:4}},outcomeText:"婚禮上大家都笑得很開心，只有你自己回家打開記帳 App 嘆了一口氣，決定接下來三週晚餐全部自己煮麵。"},{id:"selective_attend_budget",label:"只挑最要好的一場出席，其餘禮到人不到並把稅款辦分期減輕現金壓力",sublabel:"存款減少 $9,500，守住緊急預備金但略感人情疏離",effect:{savingsDelta:-9500,statsDelta:{energy:1,life:-3}},outcomeText:"雖然心裡有點不好意思，但至少沒有讓這個月帳戶見底，也學會量力而為才是長久之道。"}]},{id:"life_expense_dental_root_canal",title:"牙痛拖到半夜掛急診：牙醫宣布得做顯微根管與全瓷冠自費",category:"life",tag:"醫療自費帳單",weight:16,conditions:{minAge:26,maxAge:58},narrative:"忙著趕專案一再延後洗牙與補牙，這週終於半夜痛到睡不著。牙醫照完 X 光搖搖頭說已經蛀到神經，想保住這顆臼齒得做顯微根管加上全瓷冠牙套，健保不給付，整套報價三萬二千元。",choices:[{id:"do_proper_crown",label:"牙齒要用一輩子：咬牙刷卡做完整根管與牙套，徹底治好不留後患",sublabel:"存款減少 $32,000，保住長期健康與生活品質",effect:{savingsDelta:-32e3,statsDelta:{energy:4,life:2}},outcomeText:"付錢那刻幾乎聽到存摺哀嚎，但終於能正常吃飯不再半夜痛醒，也下定決心以後再忙也要每半年定期看牙。"},{id:"cheaper_metal_or_delay",label:"選最便宜的健保根管加基礎材質先撐著，能省一半是一半",sublabel:"存款減少 $14,000，但治療過程折騰且恢復期不適",effect:{savingsDelta:-14e3,statsDelta:{energy:-5,life:-2}},outcomeText:"跑了五趟診所總算補起來，省下一萬八的代價是往後啃硬東西都得小心翼翼。"}]},{id:"life_expense_laptop_phone_dead",title:"陪伴五年的筆電與手機同月罷工：不換連工作群組都回不了",category:"life",tag:"3C 設備汰換",weight:15,conditions:{minAge:24,maxAge:55},narrative:"組織沒配公務手機、筆電也早已過保卡頓，偏偏這週你自己的筆電主機板燒掉，手機電池也膨脹到自動關機。明天還要交計畫簡報跟回工作 LINE，只好衝去賣場看著動輒兩三萬的標價發呆。",choices:[{id:"buy_reliable_new_gear",label:"一次換成耐用中階新機，免得開會簡報到一半又藍屏社死",sublabel:"存款減少 $28,000，工作效率與日常順暢度大幅提升",effect:{savingsDelta:-28e3,statsDelta:{energy:3,capital:2,life:2}},outcomeText:"新筆電三秒開機的那一刻確實很爽，只是分期帳單會提醒你這筆支出整整半年的時間。"},{id:"buy_refurbished_and_repair",label:"手機只花錢換副廠電池、筆電買二手整新機先頂著用",sublabel:"存款減少 $12,000，守住現金流但設備偶爾還是卡頓",effect:{savingsDelta:-12e3,statsDelta:{energy:-4,life:-2}},outcomeText:"靠著逛拍賣網站跟維修小店省下一萬六，雖然新買的二手筆電風扇聲像吹風機，至少簡報順利交卷了。"}]},{id:"life_expense_insurance_and_home_appliance",title:"商業醫療險保費調漲＋居家家電汰換：成年人的隱形固定帳單",category:"life",tag:"風險防護與生活費",weight:15,conditions:{minAge:28,maxAge:52},narrative:"月底一次收到兩張通知：年繳的實支實付醫療與意外險因年齡級距與條款調整一次調漲，同時間家裡除濕機與熱水器也雙雙故障。這類平常不會算進月薪試算表的隱形開銷，總在最沒防備的時候一起報到。",choices:[{id:"keep_full_insurance_and_replace",label:"醫療保障不能斷！照繳年保費並把壞掉的家電一次換新",sublabel:"存款減少 $24,000，守住生病時的風險底線與居住舒適度",effect:{savingsDelta:-24e3,statsDelta:{energy:2,life:4}},outcomeText:"看著帳戶數字縮水一截，但想到身邊曾有同業沒買保險住院差點借錢，還是覺得這筆保命錢不能省。"},{id:"trim_insurance_and_diy",label:"請保險業務把保單瘦身成最陽春的基礎方案，家電先買便宜二手貨湊合",sublabel:"存款減少 $11,000，短期壓力減輕但未來抗風險能力下降",effect:{savingsDelta:-11e3,statsDelta:{energy:-3,life:-3}},outcomeText:"帳面現金守住了，但半夜聽著二手除濕機喀喀作響，心裡也明白低薪最可怕的是連風險緩衝都得打折。"}]},{id:"life_npo_mba_program",title:"報考私立大學「非營利組織管理學程碩士在職專班」：週末上課換學位與跨團人脈？",category:"intertwined",tag:"在職進修與人脈",weight:15,conditions:{orgTypes:["large_welfare","grassroots","local_foundation","advocacy_ngo","academic_society","corp_intl_ngo"],excludeOutsideNPO:!0,minAge:26,maxAge:46,minTenure:2},narrative:"工作幾年後，你開始覺得單靠現場土法煉鋼總有天花板。某私立大學的「非營利組織管理學程碩士在職專班」正在招生，簡章上寫著師資涵蓋社福、倡議、勸募與組織治理實務，同學多半是各組織主管與資深專員。只是兩年學分費加上週末整天上課、下班趕論文，對存款與體力都是硬仗。",choices:[{id:"enroll_npo_mba",label:"正式報考入學！咬牙扛兩年學分費與週末課表，把實務經驗升級成管理視野",sublabel:"存款 -$65,000、身心能量大減，但大幅累積專業資本、人脈與學歷加給資格",effect:{savingsDelta:-65e3,hasProfessionalCert:!0,salaryDelta:2500,statsDelta:{energy:-10,capital:16,purpose:6,life:-6,impactScore:10},milestoneTag:"考取私立大學非營利組織管理學程碩士在職專班"},outcomeText:"兩年來週六早八準時進教室、半夜改問卷差點懷疑人生，但拿到學位與認識一群不同領域的同學後，你第一次感覺自己不再是一個人在孤軍奮戰。"},{id:"audit_free_lectures",label:"先旁聽公開講座與工作坊就好，把六萬多學費留著當緊急預備金",sublabel:"守住存款與週末睡眠，靠免費跨團社群慢慢補齊管理知識",effect:{statsDelta:{energy:3,capital:6,life:4,impactScore:4}},outcomeText:"你把簡章收進抽屜，改報名幾場免費的組織治理與財務講座。雖然沒有多一張碩士文憑，但週末能好好睡到自然醒也是一種續航力。"}]},{id:"life_union_labor_grad_school",title:"報考國立大學「勞工研究所」在職專班：把第一線勞權實務升級為勞動法與集體協商專業",category:"intertwined",tag:"工會在職進修",weight:16,conditions:{orgTypes:["industrial_union","occupational_union"],excludeOutsideNPO:!0,minAge:26,maxAge:46,minTenure:2},narrative:"跑了幾場勞資爭議調解與裁決庭後，你越來越深刻體會只靠熱血衝撞不夠，面對資方律師團還得要有更扎實的勞動法理與集體談判研究功底。某國立大學「勞工研究所」在職專班正在招生，同學幾乎都是各工會幹部、調解人與勞政實務者，只是兩年通勤上課與寫論文勢必吃掉所有週末。",choices:[{id:"enroll_labor_grad_school",label:"報考入學！扛下學費與兩年下班唸書壓力，取得勞研所碩士學位與跨工會戰友網",sublabel:"存款 -$55,000、獲得證照／碩士敘薪資格，談判底氣與專業人脈大增",effect:{savingsDelta:-55e3,hasProfessionalCert:!0,salaryDelta:2500,statsDelta:{energy:-10,capital:17,purpose:7,life:-6,impactScore:11},milestoneTag:"考取國立大學勞工研究所在職專班"},outcomeText:"下班趕高鐵去上勞工法研討課的日子累到不行，但寫出的碩士論文案例直接被其他工會拿來當裁決參考，那份專業自信無可取代。"},{id:"join_labor_study_group",label:"暫不背學費與論文債，先加入免費跨工會勞動法讀書會累積實戰筆記",sublabel:"守住存款與休假時間，用案例實戰與前輩共學替代正式學位",effect:{statsDelta:{energy:3,capital:7,life:4,impactScore:5}},outcomeText:"你省下五萬多學費，每隔週晚上和幾位友會秘書聚在咖啡廳拆解最新裁決書，一樣練出一身硬底子。"}]},{id:"life_union_social_gathering",title:"受邀參加工會聯誼活動：原來全台灣不是只有我在這間辦公室快撐不下去",category:"life",tag:"工會交流與支持",weight:15,conditions:{excludeOutsideNPO:!0,minTenure:1},narrative:"週末傍晚，朋友拉你參加一場由工會舉辦的「民間組織與基層工作者聯誼餐會」。走進餐廳原本有點社恐，沒想到一聊起來，隔壁桌的學會秘書、社福社工、倡議專員跟工會幹部全都在吐一樣的苦水——凍薪、理監事會奇聞、評鑑核銷與永無止境的庶務地獄。大家邊吃邊笑，反而有一種久違的被理解感。",choices:[{id:"join_union_mutual_aid",label:"留到最後和大家交換聯絡方式，加入互助群組固定交流薪資行情與職場經驗",sublabel:"花一點餐費與週末夜晚，換來跨組織戰友與情緒支持網",effect:{savingsDelta:-800,statsDelta:{energy:8,purpose:7,capital:8,life:8,impactScore:5}},outcomeText:"回家路上你發現手機多了十幾個新朋友，群組裡有人分享薪資行情、有人整理勞基法範本。原來知道自己不孤單，就足以讓人多撐過好幾個低潮。"},{id:"greet_and_rest_early",label:"禮貌打完招呼、聽完大家經驗分享就先回家早點休息",sublabel:"省下社交耗電，帶回幾個實用小道消息並保有獨處時間",effect:{savingsDelta:-500,statsDelta:{energy:5,capital:3,life:4}},outcomeText:"雖然沒有深聊，但聽見別間組織也有一模一樣的荒謬日常，你心裡默默鬆了一口氣，回家泡了杯熱茶早早上床睡覺。"}]},{id:"life_union_labor_education",title:"報名工會勞動教育課程：第一次把《勞基法》、特休與勞退帳本徹底搞懂",category:"intertwined",tag:"勞動權益培力",weight:15,conditions:{excludeOutsideNPO:!0,minTenure:1},narrative:"工會在假日開了一場免費的「非營利與受僱者勞動教育工作坊」，主題直指圈內最常踩的坑：補休歸零、假承攬真僱傭、高薪低報、以及勞退 6% 怎麼查。報名人數意外爆滿，台上講師一句「做好事不代表你要放棄自己的勞動基準」，讓台下不少人默默點頭拍照。",choices:[{id:"audit_own_labor_rights",label:"認真抄完筆記並回家核對自己的薪資單、投保級距與勞退專戶",sublabel:"把法規知識變成保護自己的護身符，未來面對不合理要求更有底氣",effect:{statsDelta:{energy:-2,purpose:6,capital:10,life:4,impactScore:8},milestoneTag:"完成工會勞動教育培力並學會維護自身勞權"},outcomeText:"核對完資料才發現自己過去對加班費與投保級距一知半解。你把講義存進雲端，也開始懂得在不撕破臉的前提下，用白紙黑字保護自己與同事。"},{id:"share_labor_edu_with_team",label:"順手把課程重點整理成懶人包分享給辦公室同事，一起討論合理工時",sublabel:"從獨善其身走向集體意識，在團隊裡播下重視勞動條件的種子",effect:{statsDelta:{energy:-4,purpose:9,capital:8,life:2,impactScore:12}},outcomeText:"茶水間裡大家第一次公開聊起補休與加班規範，雖然主管路過時表情有點微妙，但團隊對「好好工作也要好好生活」多了一份共識。"}]},{id:"arc_early_intern_crisis",title:"帶到一位快被現場挫敗擊垮的實習生／菜鳥同事",category:"work",tag:"跨年伏筆 · 世代陪伴",weight:18,conditions:{excludeOutsideNPO:!0,minTenure:1,maxTenure:6},narrative:"這季單位分派給你帶一位剛接觸實務的大專實習生或菜鳥助理。才第三週，對方就在電話被當事人或窗口罵完後躲在樓梯間紅了眼眶，小聲問你：「我是不是根本不適合來{orgNoun}工作？」眼看你自己手邊還有兩份急件等著下班前交出。",choices:[{id:"mentor_intern_carefully",label:"把手邊急件先延一小時，帶他去喝杯熱飲拆解剛剛那通電話「不是你的錯」",sublabel:"今晚得晚一點回家，但替這個圈子留住一顆尚未熄滅的種子（未來可能重逢）",effect:{setFlag:"intern_mentored",statsDelta:{energy:-5,purpose:7,capital:4,life:-1,impactScore:6}},outcomeText:"你教他怎麼分辨「對象的焦慮」跟「自己的能力」，結束實習那天他送你一張寫滿謝謝的便條紙，說以後一定還要投入公共領域。"},{id:"tell_them_toughen_up",label:"安慰兩句「做這行本來就這樣，多被罵幾次就習慣了」便回去趕自己的急件",sublabel:"保住自己準時下班與今晚的睡眠，不額外扛帶人的情緒勞動",effect:{statsDelta:{energy:1,purpose:-2,capital:1,life:2}},outcomeText:"實習結束後那個年輕人再也沒有回過辦公室訊息，聽說畢業後直接去考公職或進了科技業。"}]},{id:"arc_intern_returns_ally",title:"多年後的重逢：當年你帶過的菜鳥如今成了關鍵跨界戰友",category:"intertwined",tag:"劇情回收 · 當年的種子",weight:24,conditions:{excludeOutsideNPO:!0,minTenure:5,requiredFlag:"intern_mentored"},narrative:"這季你們正在推一項吃力卻沒什麼媒體聲量的重點工作。忽然一封標題寫著「還記得樓梯間那杯熱紅茶嗎」的信寄進信箱——當年差點在實習期陣亡、被你耐心接住的那個年輕人，如今已在中央媒體跑政策線（或進了部會幕僚室），主動問你需要什麼協助。",choices:[{id:"co_launch_impact_feature",label:"不走私下關說，而是與他合作企劃一篇扎實的專題報導／公開政策建言",sublabel:"把多年情誼轉化為真正推動制度的公共影響力，寫下職涯高光時刻",effect:{statsDelta:{energy:-4,purpose:12,capital:10,life:3,impactScore:18},milestoneTag:"與當年親自帶領的後輩重逢並促成跨界合作"},outcomeText:"專題刊出那天引起廣泛討論，他私訊你：「當年如果不是你告訴我不是我的錯，我早就離開這個領域了。」那一刻過去所有的疲憊彷彿都有了回音。"},{id:"stay_humble_swap_insights",label:"約出來喝杯咖啡敘舊、交換第一線最新資訊，彼此保留專業獨立性",sublabel:"收穫一場療癒的跨世代對談，為接下來幾年補回滿滿理想電力",effect:{statsDelta:{energy:6,purpose:10,capital:7,life:6,impactScore:9}},outcomeText:"看著他神采奕奕談起公共事務的樣子，你突然想起來自己二十幾歲時眼裡也有過同樣的光。"}]},{id:"arc_sop_saves_audit",title:"突襲查核與人事劇烈震盪：當年你熬夜建的「交接與歸檔 SOP」救了全場",category:"work",tag:"劇情回收 · 制度回響",weight:24,conditions:{excludeOutsideNPO:!0,minTenure:4,requiredFlag:"rookie_built_sop"},narrative:"會計年度最忙的時刻突然遇上主管機關專案抽查（加上負責行政的同事臨時請長假）。就在全辦公室陷入找不到三年前原始憑證與簽呈的恐慌時，有人翻出你剛到職那年硬著頭皮建立起來的雲端索引與標準歸檔規範，所有資料十分鐘內完整調出！",choices:[{id:"formalize_org_handbook",label:"趁這次滿分過關，正式向{boardNoun}提案把這套架構升格為組織標準治理手冊",sublabel:"證明行政基建的長期價值，大幅提高組織韌性與個人專業地位",effect:{orgFinanceDelta:1,statsDelta:{energy:-3,purpose:8,capital:12,life:2,impactScore:14},milestoneTag:"新人期建置的交接制度獲肯定並升格為組織治理手冊"},outcomeText:"{bossTitle}在{boardNoun}會議上公開點名致謝：「還好當年有你把亂帳理清楚，不然這次真的要賠掉公信力。」"},{id:"share_template_with_peers",label:"順手把這套去識別化的歸檔與交接範本開源分享給友會同事使用",sublabel:"幫整個民間圈少走冤枉路，跨組織專業口碑大增",effect:{statsDelta:{energy:-2,purpose:10,capital:10,life:3,impactScore:15}},outcomeText:"好幾個小型組織的專員私訊感謝你救了他們的報帳地獄，你笑著回覆：「這是當年自己踩完四百個資料夾地雷換來的。」"}]},{id:"arc_early_report_pressure",title:"結案前夕的數字壓力：合作方暗示「把成果報告數據修漂亮一點」",category:"work",tag:"跨年伏筆 · 專業誠信",weight:18,conditions:{excludeOutsideNPO:!0,minTenure:1,maxTenure:6},narrative:"年度重要方案或研究到了結案交卷時刻，但受限於現實疫情、天氣或參與人數門檻，實際成效只有原訂指標的七成。對口承辦與部分高層私下暗示：「把問卷滿意度跟參與人次寫法調整得好看一點，大家明年才都好交差。」",choices:[{id:"insist_honest_reporting",label:"拒絕灌水！把真實數字與困難原因如實寫進檢討報告，同時附上具體修正方案",sublabel:"短期可能挨一頓刮或被嫌不知變通，但守住實務工作者的專業名譽（日後會有迴響）",effect:{setFlag:"kept_professional_integrity",statsDelta:{energy:-5,purpose:8,capital:6,life:-1,impactScore:8}},outcomeText:"會議上確實挨了一頓冷眼，但現場幾位外聘審查委員翻到你寫得極其坦誠的限制章節時，悄悄多看了你一眼並記下你的名字。"},{id:"polish_metrics_quietly",label:"採取「合法合規的美化寫法」讓結案數字達標，免得整個團隊明年被扣預算",sublabel:"保全當年度經費過關與表面和氣，但你知道報告裡那幾行數字是空的",effect:{statsDelta:{energy:-2,purpose:-6,capital:2,life:1,impactScore:3}},outcomeText:"案子順利結清了，只是你從此很怕別人問起那份報告到底對真實世界有什麼幫助。"}]},{id:"arc_integrity_policy_invite",title:"多年後的口碑迴響：當年看過你「誠實檢討報告」的委員邀你主持重點計畫",category:"work",tag:"劇情回收 · 誠信紅利",weight:24,conditions:{minTenure:5,requiredFlag:"kept_professional_integrity"},narrative:"幾年前某位看過你寧可挨罵也不願灌水結案報告的資深學者／評審委員，如今受邀負責一項跨縣市的旗艦級實務評估與培力計畫。他在會議上指名找你：「全場一堆報告都在寫完美神話，只有你當年敢寫出真實阻力在哪裡，這個位置非你莫屬。」",choices:[{id:"lead_flagship_review",label:"接下外部共同主持／諮詢邀請！將真實第一線困境帶入高層評鑑設計",sublabel:"取得 $18,000 專業顧問回饋並大幅拉升跨界資歷與政策話語權",effect:{savingsDelta:18e3,statsDelta:{energy:-5,purpose:10,capital:14,life:2,impactScore:18},milestoneTag:"因早年堅持專業誠信獲邀主持跨區實務諮詢計畫"},outcomeText:"當你在正式工作坊簡報裡講出「誠實面對失敗，系統才真的修得好」時，台下不少年輕工作者拼命點頭抄筆記。"},{id:"recommend_team_and_co_design",label:"帶著組織年輕夥伴一起參與協作，把難得的專業信任轉化成團隊共同舞台",sublabel:"分享榮譽與鍛鍊後輩，讓誠信成為組織文化的一部分",effect:{savingsDelta:8e3,statsDelta:{energy:-3,purpose:11,capital:10,life:4,impactScore:15}},outcomeText:"你替單位爭取到一筆合理的專業協力費，也讓後輩親眼見證「在民間領域，把話說真話做實，久了真的會有路」。"}]},{id:"arc_friend_corporate_bridge",title:"老戰友回來敲門：當年轉進外商的他，如今手握企業永續預算想跟你聯手",category:"intertwined",tag:"劇情回收 · 跨界同盟",weight:24,conditions:{excludeOutsideNPO:!0,minTenure:6,requiredFlag:"blessed_departing_friend"},narrative:"幾年前在居酒屋紅著眼眶離開民間圈、當時你抱著他給出祝福的那位戰友，如今已升上大型外商企業公關與永續副理。他私下約你吃飯：「我們公司今年有一筆兩百萬的非綁標長期支持預算，我第一時間就想到你——而且如果你累了，我們部門也剛好有個副理缺。」",choices:[{id:"bring_budget_back_to_field",label:"婉拒跳槽邀請，但幫{orgNoun}談成「不綁過多商業曝光」的兩年期基礎支持合作",sublabel:"替現職組織補進關鍵彈藥並深化跨界影響力，當年那場祝福開出了最美的花",effect:{orgFinanceDelta:1,statsDelta:{energy:-2,purpose:11,capital:11,life:5,impactScore:17},milestoneTag:"攜手轉戰外商的昔日戰友促成跨界長期合作案"},outcomeText:"簽約那天他在簡報室對你眨眨眼：「看吧，我在外面賺資源、你在裡面守現場，這算不算另一種一起改變台灣？」"},{id:"accept_bridge_move_outside",label:"誠實承認自己也需要喘息與合理回報，答應接下對方邀請轉往企業永續端",sublabel:"【轉赴企業 ESG 部門】月薪跳升至 $68,000，與老友重新成為企業端推動夥伴",effect:{enterOutsideNPO:{orgName:"海風永續科技集團 ESG 公共事務部",role:"corp_esg_officer",newSalary:68e3},setRoleTitle:"永續發展副理",statsDelta:{energy:10,purpose:-2,capital:10,life:12},milestoneTag:"受昔日戰友邀請轉任企業 ESG 公共事務部門"},outcomeText:"報到第一天他端了兩杯免費拿鐵進會議室笑說：「歡迎來到有冷氣和年終的世界，別忘了我們還要一起幫以前那些傻朋友找資源。」"}]},{id:"arc_early_quiet_followup",title:"沒有任何 KPI 要求的結案之後：要不要多跑一趟現場回訪？",category:"work",tag:"跨年伏筆 · 現場連結",weight:18,conditions:{excludeOutsideNPO:!0,minTenure:1,maxTenure:5},narrative:"一個階段性的專案或服務已經依法如期結案、成果報告也拿滿核銷章了。同事都在忙著趕下一檔期新案，但你突然想起過程中某幾位特別脆弱、還沒完全站穩的{targetNoun}，如果沒人再問候一聲，他們很容易又掉出接住網之外。",choices:[{id:"do_unpaid_quiet_followup",label:"撥出兩個空檔親自打電話與走訪回顧，確認對方後續真正安頓下來",sublabel:"不在考績表上的溫柔堅持，默默種下深厚的民間信任（日後將有回音）",effect:{setFlag:"rooted_community_trust",statsDelta:{energy:-4,purpose:9,capital:3,life:-1,impactScore:7}},outcomeText:"其中一位阿姨或師傅握著你的手反覆說「還好你們做完活動沒有把我們忘記」，回程路上你覺得整個人都很踏實。"},{id:"move_on_to_next_kpi",label:"告訴自己「資源有限不能無限承諾」，收心全速投入下一個年度重點專案",sublabel:"維持高效率推進節奏，符合現代專業化管理邊界",effect:{statsDelta:{energy:1,purpose:-1,capital:4,life:2,impactScore:4}},outcomeText:"進度表漂亮地如期推進，只是偶爾經過那條巷口或單位外時，心裡會閃過一秒「不曉得他後來怎麼了」。"}]},{id:"arc_community_stands_up",title:"組織陷入低潮的那年：當年你真誠回訪過的現場夥伴自發站出來相挺",category:"intertwined",tag:"劇情回收 · 民間回響",weight:24,conditions:{excludeOutsideNPO:!0,minTenure:5,requiredFlag:"rooted_community_trust"},narrative:"這季單位遭遇預算斷層或外界誤解攻擊，辦公室氣氛降到冰點。就在大家幾乎以為這件事沒有人在乎時，幾位幾年前你在沒有任何 KPI 壓力下回訪陪伴過的{targetNoun}與在地夥伴，竟自發串聯上百人連署聲援，還帶著社區手作與小額資助走進辦公室。",choices:[{id:"co_create_mutual_aid_network",label:"借這股來自現場的力量轉型成「自助互助行動網」，不再只靠單向救濟運作",sublabel:"把感動升級成永續組織結構，扭轉財務與使命低谷",effect:{orgFinanceDelta:1,statsDelta:{energy:6,purpose:14,capital:8,life:7,impactScore:18},milestoneTag:"早年深耕現場的夥伴反過來挺身撐住組織度過低谷"},outcomeText:"一位大哥站在大門口說：「以前你們沒寫進報告還跑來看我們，現在換我們幫你們撐傘。」整間辦公室瞬間有人紅了眼眶。"},{id:"thank_them_and_keep_boundary",label:"滿懷感謝地接住這份心意，妥善公開徵信每一筆支持並穩住既定節奏",sublabel:"能量與理想瞬間回血，更確信自己這幾年沒有白走",effect:{statsDelta:{energy:8,purpose:12,capital:5,life:6,impactScore:12}},outcomeText:"那天晚上你們把大家送來的卡片貼滿公告欄，你突然徹底明白：真正的社會資本從來不在簡報數字裡，而在人與人的記憶裡。"}]},{id:"arc_early_weekend_boundary",title:"「做志業哪有人在算補休的？」：面對組織裡無償週末加班的潛規則",category:"work",tag:"跨年伏筆 · 勞動文化",weight:18,conditions:{excludeOutsideNPO:!0,minTenure:1,maxTenure:5},narrative:"這季你已經連續三個禮拜六支援{weekendTask}，週一進辦公室卻發現系統裡沒有任何補休紀錄。資深同事笑著說：「我們這行都是用愛發電啦，申請補休會被{bossTitle}跟老理事覺得計較。」你看著鏡子裡黑眼圈越來越深的自己。",choices:[{id:"log_hours_and_push_policy",label:"開始逐筆記錄出勤時數，在內部會議禮貌提案「活動加班應依法給補休並限期休畢」",sublabel:"可能短暫被貼上「比較計較」標籤，但種下改變組織血汗文化的種子",effect:{setFlag:"defended_healthy_boundary",statsDelta:{energy:2,purpose:6,capital:5,life:5,impactScore:6}},outcomeText:"雖然經歷了一番「經費有限怎麼排班」的拉扯，但{bossTitle}最後點頭試辦實名補休紀錄——團隊第一次在活動後真的能好好放假一天。"},{id:"go_with_flow_silently",label:"不想剛待沒幾年就變成同事眼中的刺頭，繼續照潛規則默默吞下假日工時",sublabel:"短期職場人際最安全，但身體與生活感持續磨損",effect:{statsDelta:{energy:-7,purpose:-3,capital:1,life:-5}},outcomeText:"大家繼續笑稱自己是「功德無量組」，只是這一年離職的人好像又多了一個。"}]},{id:"arc_boundary_culture_shift",title:"多年後的口碑反轉：「聽說你們單位是真的給補休、不靠情緒勒索運作的？」",category:"work",tag:"劇情回收 · 良善循環",weight:24,conditions:{excludeOutsideNPO:!0,minTenure:5,requiredFlag:"defended_healthy_boundary"},narrative:"以前開出招募職缺總是石沉大海，今年居然一口氣湧進十幾位資深實務工作者與優秀新人投履歷。面試時對方笑著坦白：「圈內朋友都說，這家單位是少數真的有落實補休、不用免費奉獻證明熱情的地方，我們才敢把下一個五年賭在這裡。」",choices:[{id:"recruit_strong_team_upgrade",label:"趁勢補齊夢幻新夥伴！把組織正式升級為兼顧專業效能與合理工時的示範據點",sublabel:"大幅緩解自身長年扛責壓力，組織戰力與生活感同步拉升",effect:{statsDelta:{energy:10,purpose:10,capital:10,life:9,impactScore:15},milestoneTag:"早年推動合理補休制度終成招募即戰力的最強招牌"},outcomeText:"新夥伴報到第一個月就幫團隊解決了積壓已久的專案瓶頸。你望著六點準時熄燈卻產出極高的辦公室，覺得當初敢開口真好。"},{id:"publish_healthy_workplace_guide",label:"把你們這幾年的排班與補休做法寫成「非營利組織友善職場小指南」公開分享",sublabel:"打破整個領域「做好事就該過勞」的神話，累積跨界影響力",effect:{statsDelta:{energy:6,purpose:12,capital:9,life:7,impactScore:16}},outcomeText:"文章發出後被轉發破千次，好幾位友會幹部留言：「原來真的有人做得到，下週理監事會我也要拿去提案！」"}]},{id:"life_all_used_car_loan",title:"外勤跑點與家庭接送需求增加：要不要分期買一輛中古代步車？",category:"life",tag:"代步與車貸抉擇",weight:14,conditions:{minAge:26,maxAge:50,minTenure:2,excludeOutsideNPO:!0},narrative:"這幾年頻繁跨區跑據點與會議，加上下雨天接送家人或搬運活動物資，沒有汽車愈來愈吃力。朋友介紹一輛車況不錯的五年國產中古車開價二十六萬，業務說可以辦三十六期車貸、頭期先付兩萬。看著帳戶餘額，你在時間體力與固定車貸之間猶豫。",choices:[{id:"buy_used_car_with_loan",label:"決定分期購入中古代步車！先付兩萬頭期款並背負三年 $7,200 車貸",sublabel:"存款 -$20,000、新增 $240,000 車貸（每月 $7,200），換取行動力與體力修復",effect:{savingsDelta:-2e4,addCarLoan:{totalAmount:24e4,monthlyPayment:7200},statsDelta:{energy:7,capital:4,life:6,impactScore:6},milestoneTag:"分期購入代步汽車改善外勤與家庭移動品質"},outcomeText:"拿到鑰匙那晚你在車裡坐了五分鐘。雖然接下來三年帳本每個月都要多扣七千多塊車貸，但大雨天終於不用再穿著雨衣載一箱文件奔波。"},{id:"keep_transit_and_scooter",label:"精算養車＋停車＋車貸太傷現金流，維持機車與大眾運輸／偶爾租共享車",sublabel:"守住每月支出不被固定車貸綁死，體力消耗略高但現金流安全許多",effect:{statsDelta:{energy:-4,life:-1,capital:1}},outcomeText:"算完車貸加上油錢保養一年少存快十萬後你果斷放棄，改把預算留給緊急預備金。"}]},{id:"life_housing_move_out_from_parents",title:"住家裡的自由與摩擦：工作存了一點錢，要不要搬出去獨立租屋？",category:"life",tag:"居住獨立抉擇",weight:16,conditions:{minAge:25,maxAge:38,minTenure:1,housing:["with_parents"]},narrative:"雖然暫住家裡省下不少房租，但加班晚歸被念、休假在家想補眠卻不斷被打斷，加上親戚偶爾來家裡串門子又要被關心薪水與婚事，讓你漸漸覺得沒有喘息空間。看著帳戶存款，你開始認真考慮搬出去租屋。",choices:[{id:"move_out_to_studio",label:"搬出去租獨立小套房！付押金與搬家費換回真正屬於自己的下班生活",sublabel:"存款 -$24,000、轉為獨立租屋（每月居住支出大幅增加），但身心與生活關係大補血",effect:{housing:"studio_rent",savingsDelta:-24e3,statsDelta:{energy:6,life:10}, nt",label:"搬進獨立小套房！把下班後的安靜修復品質當作長跑必備投資",sublabel:"存款 -$20,000（押金與家具）、轉為獨立租屋，每月支出增加但能量與生活感大升",effect:{housing:"studio_rent",savingsDelta:-2e4,statsDelta:{energy:9,life:8},milestoneTag:"改善居住品質搬入獨立租屋套房"},outcomeText:"搬進有對外窗的獨立小套房那週，你連著睡了三天從沒被室友關門聲吵醒的好覺，白天脾氣也明顯變好了。"},{id:"endure_shared_keep_saving",label:"戴上降噪耳機繼續忍一忍！把每個月多省下來的房租差額留著當未來底氣",sublabel:"維持低房租結構持續累績存款，代價是生活幸福感略微磨損",effect:{statsDelta:{energy:-4,life:-3}},outcomeText:"你買了一組超強隔音耳塞跟獨立小冰箱放進房間，提醒自己「等存款再厚一點再說」。"}]},{id:"life_filial_negotiate_down",title:"帳單與孝親費兩頭燒：要不要向父母坦白真實薪資、協商調降每月家用？",category:"life",tag:"原生家庭財務協商",weight:19,conditions:{minTenure:1,maxSavings:9e4,parentCare:["allowance"]},narrative:"這幾個月扣除房租、生活費與固定匯回老家的孝親費後，存摺幾乎一直在負成長邊緣徘徊。每次媽媽電話裡說「在台北（或外面）做那種公益工作應該很體面吧」，你都不敢告訴他自己月底連掛號費都要精算。",choices:[{id:"honest_talk_reduce_3000",label:"週末回家把薪資單與收支表攤開誠實溝通，請求每月孝親費先調降三千元",sublabel:"每月固定支出 -$3,000！打破報喜不報憂的惡性循環，雖有愧疚但保住現金流",effect:{monthlyFilialDelta:-3e3,statsDelta:{energy:4,purpose:1,life:-2},milestoneTag:"與原生家庭坦誠溝通實際薪資並調降孝親費"},outcomeText:"媽媽看著你的薪資單沉默了好一陣子，最後嘆了口氣說：「早知道你領這麼少還一直硬撐……先顧好自己吃飯要緊。」雖有點鼻酸，肩膀卻瞬間輕了一截。"},{id:"rebalance_with_siblings",label:"召開手足／親戚家庭會議重算長輩開銷，請經濟較寬裕的家人多扛兩千元",sublabel:"每月固定支出 -$2,000，讓照顧責任不再只壓在單一成員身上",effect:{monthlyFilialDelta:-2e3,statsDelta:{energy:2,capital:2,life:1}},outcomeText:"大家把父母的年金、國民年金與實際水電買菜費重新對了一次，原來有許多重複支出的部分，重新分工後你每個月少負擔兩千元。"},{id:"keep_paying_silently",label:"不想讓兩老為自己擔心，咬緊牙關維持原本的孝親額度、靠自己再省一點",sublabel:"維持家人安心與和氣，但個人經濟與身心壓力持續累積",effect:{statsDelta:{energy:-5,life:3}},outcomeText:"你笑著回電話說「我最近有存錢啦不用擔心」，掛斷後默默把購物車裡的東西全部刪掉。"}]},{id:"life_filial_raise_after_growth",title:"存款與薪資總算穩下來了：要不要主動替父母多加一筆每月家用？",category:"life",tag:"家庭回饋選擇",weight:14,conditions:{minTenure:4,minSavings:18e4,parentCare:["healthy","allowance"]},narrative:"熬過前幾年的捉襟見肘，現在的存款數字總算能應付突發狀況。最近回家發現爸媽省吃儉用、冷氣老是捨不得開，你在想既然手頭寬裕了些，是不是該主動每個月多轉一筆固定家用過去。",choices:[{id:"raise_filial_allowance",label:"設定每月固定多轉 $2,500 孝親家用，要爸媽別再為了省電費捨不得開冷氣",sublabel:"每月固定孝親支出 +$2,500，大幅增進家庭關係與安心感",effect:{parentCare:"allowance",monthlyFilialDelta:250
